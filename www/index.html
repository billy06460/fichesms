    // ---- 04 Équipement ----
    sectionTitle('Équipement présent');
    var eq = m.equipment || {};
    var eqLabels = { fuelCard: 'Carte carburant', telepeage: 'Télépéage', bouclier: 'Bouclier', pareBalle: 'Pare-balle', sac: 'Sac', ceinture: 'Ceinture', entrave: 'Entrave' };
    var eqKeys = Object.keys(eqLabels);
    var eqColW = (pageW - margin * 2 - 12) / 3;
    var eqRowH = 9;
    eqKeys.forEach(function(k, i){
      var col = i % 3;
      var row = Math.floor(i / 3);
      var x = margin + col * (eqColW + 6);
      var yy = y + row * eqRowH;
      var on = !!eq[k];
      pdfSetDraw(doc, on ? C.success : C.border);
      doc.setLineWidth(0.4);
      if (on) pdfSetFill(doc, C.successBg);
      doc.roundedRect(x, yy, eqColW, 7, 1, 1, on ? 'FD' : 'D');
      pdfSetDraw(doc, C.text);
      doc.setLineWidth(0.35);
      doc.rect(x + 2, yy + 2, 3, 3, on ? 'S' : 'S');
      if (on){
        doc.setLineWidth(0.5);
        doc.line(x + 2.3, yy + 3.6, x + 3.2, yy + 4.6);
        doc.line(x + 3.2, yy + 4.6, x + 4.8, yy + 2.3);
      }
      pdfSetText(doc, on ? C.success : C.muted);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8.5);
      doc.text(eqLabels[k], x + 7, yy + 5);
    });
    y += Math.ceil(eqKeys.length / 3) * eqRowH + 6;

    // ---- 05 État du véhicule ----
    y = ensureSpace(y, 30);
    sectionTitle('État du véhicule');
    var stateLabels = { ok: 'Bon état', minor: 'Usure mineure', damage: 'Dégâts constatés' };
    var stateColorMap = {
      ok: { fg: C.success, bg: C.successBg },
      minor: { fg: C.accentStrong, bg: C.warnBg },
      damage: { fg: C.danger, bg: C.dangerBg }
    };
    var sc = stateColorMap[m.stateLevel] || stateColorMap.ok;
    pdfSetFill(doc, sc.bg);
    var pillLabel = stateLabels[m.stateLevel] || '-';
    var pillW = doc.getTextWidth(pillLabel) + 10;
    doc.roundedRect(margin, y, pillW, 7, 2, 2, 'F');
    pdfSetText(doc, sc.fg);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text(pillLabel, margin + pillW / 2, y + 4.7, { align: 'center' });
    y += 11;
    pdfSetText(doc, C.muted);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text('REMARQUES', margin, y);
    y += 4.5;
    pdfSetText(doc, C.text);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    var notesLines = doc.splitTextToSize(m.stateNotes || '(aucune remarque)', pageW - margin * 2);
    y = ensureSpace(y, notesLines.length * 5 + 4);
    doc.text(notesLines, margin, y);
    y += notesLines.length * 5 + 8;

    // ---- 06 Photos ----
    if (m.photos && m.photos.length){
      y = ensureSpace(y, 20);
      sectionTitle('Photos des défauts et tickets carburant');
      var thumbW = (pageW - margin * 2 - 2 * 5) / 3;
      var thumbH = thumbW;
      var col2 = 0;
      m.photos.forEach(function(p, idx){
        y = ensureSpace(y, thumbH + 8);
        var x = margin + col2 * (thumbW + 5);
        pdfSetDraw(doc, C.border);
        doc.setLineWidth(0.3);
        doc.roundedRect(x, y, thumbW, thumbH, 1.5, 1.5);
        try {
          var imgData = (preparedPhotos && preparedPhotos[idx] != null) ? preparedPhotos[idx] : p.dataUrl;
          doc.addImage(imgData, 'AUTO', x + 0.8, y + 0.8, thumbW - 1.6, thumbH - 1.6);
        } catch(e){}
        pdfSetText(doc, C.muted);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.5);
        doc.text('Photo ' + (idx + 1), x, y + thumbH + 3.5);
        col2++;
        if (col2 >= 3){ col2 = 0; y += thumbH + 7; }
      });
      if (col2 !== 0) y += thumbH + 7;
    }

    addFooter();
    return doc;
  }

  var downloadsCap = null;

  // ---------- native plugin access (Capacitor Filesystem, SmsComposer) ----------
  // window.Capacitor.Plugins contains working proxies for every natively-registered
  // plugin (Filesystem, Camera, and our own SmsComposer registered in MainActivity).
  function getNativeFilesystem(){
    return (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.Filesystem : null;
  }
  function getNativeSmsComposer(){
    return (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.SmsComposer : null;
  }
  function isCapacitorNative(){
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && getNativeFilesystem());
  }
  function hasSmsComposer(){
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && getNativeSmsComposer());
  }
  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onloadend = function(){
        var result = reader.result || "";
        var comma = result.indexOf(',');
        resolve(comma !== -1 ? result.slice(comma + 1) : result);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  function dataUrlToBase64(dataUrl){
    var comma = dataUrl.indexOf(',');
    return comma !== -1 ? dataUrl.slice(comma + 1) : dataUrl;
  }
  function dataUrlToBlob(dataUrl){
    var comma = dataUrl.indexOf(',');
    var meta = comma !== -1 ? dataUrl.slice(0, comma) : '';
    var mimeMatch = meta.match(/:(.*?);/);
    var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    var binary = atob(dataUrlToBase64(dataUrl));
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  // Saves the PDF and all mission photos into fiche_vehicule/<AAAA-MM-JJ>/ on the
  // device's Documents storage, using Capacitor's native Filesystem plugin.
  // Only works once @capacitor/filesystem is added to the native project.
  function saveMissionFilesNative(m, pdfBlob, pdfFilename){
    var Filesystem = getNativeFilesystem();
    var folder = 'fiche_vehicule/' + todayISODate();
    var baseName = pdfFilename.replace(/\.pdf$/i, '');

    return blobToBase64(pdfBlob).then(function(pdfBase64){
      return Filesystem.writeFile({
        path: folder + '/' + pdfFilename,
        data: pdfBase64,
        directory: 'DOCUMENTS',
        recursive: true
      });
    }).then(function(){
      var photos = m.photos || [];
      var chain = Promise.resolve();
      photos.forEach(function(p, idx){
        chain = chain.then(function(){
          return Filesystem.writeFile({
            path: folder + '/' + baseName + '_photo_' + (idx + 1) + '.jpg',
            data: dataUrlToBase64(p.dataUrl),
            directory: 'DOCUMENTS',
            recursive: true
          });
        });
      });
      return chain;
    }).then(function(){
      return folder;
    });
  }

  function exportMissionPdf(m){
    persistForm(m);
    showToast('Génération du PDF…');

    buildStyledMissionPDFAsync(m).then(function(doc){
    var rawName = m.missionNumber ? m.missionNumber : (m.plate || 'sans_numero');
    var filename = rawName.replace(/[\\/:*?"<>|]+/g, '-') + '.pdf';
    var blob = doc.output('blob');

    if (isCapacitorNative()){
      saveMissionFilesNative(m, blob, filename)
        .then(function(folder){
          var count = 1 + (m.photos ? m.photos.length : 0);
          showToast(count + ' fichier(s) enregistré(s) dans Documents/' + folder);
        })
        .catch(function(err){
          console.error('Native save failed', err);
          showToast("Échec de l'enregistrement natif, tentative via le partage…");
          fallbackShareOrDownload();
        });
      return;
    }

    fallbackShareOrDownload();

    function fallbackShareOrDownload(){

      function viaBlobAnchor(){
        try {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
          showToast('PDF téléchargé.');
        } catch(e){
          showToast("Impossible d'enregistrer le PDF sur cet appareil.");
        }
      }

      function viaDownloadsCapOrAnchor(){
        if (downloadsCap){
          downloadsCap.save({ filename: filename, data: blob })
            .then(function(){ showToast('PDF téléchargé.'); })
            .catch(function(err){
              if (err && err.code === 'declined'){ showToast('Téléchargement annulé.'); }
              else { viaBlobAnchor(); }
            });
        } else {
          viaBlobAnchor();
        }
      }

      // Prefer native share first: it carries the correct PDF file type through
      // the OS share sheet, unlike a blob: download which some WebViews save
      // with the wrong extension (e.g. .bin) because they can't read the blob's type.
      try {
        var pdfFile = new File([blob], filename, { type: 'application/pdf' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [pdfFile] })){
          navigator.share({ files: [pdfFile] })
            .then(function(){ showToast('Choisissez où enregistrer le PDF.'); })
            .catch(function(err){
              if (err && err.name === 'AbortError') return;
              viaDownloadsCapOrAnchor();
            });
          return;
        }
      } catch(e){ /* fall through */ }

      viaDownloadsCapOrAnchor();
    }
    });
  }

  function buildMessageBodyText(m){
    var eq = m.equipment || {};
    var eqLabels = { fuelCard: 'Carte carburant', telepeage: 'Télépéage', bouclier: 'Bouclier', pareBalle: 'Pare-balle', sac: 'Sac', ceinture: 'Ceinture', entrave: 'Entrave' };
    var stateLabels = { ok: 'Bon état', minor: 'Usure mineure', damage: 'Dégâts constatés' };
    var distance = "";
    if (m.kmStart !== "" && m.kmEnd !== "" && !isNaN(m.kmStart) && !isNaN(m.kmEnd)){
      distance = fmtKmNumber(Number(m.kmEnd) - Number(m.kmStart)) + ' km';
    }
    var lines = [];
    lines.push('Fiche mission — ' + (m.plate || 'Sans plaque'));
    lines.push('Unité : ' + getOrigin());
    lines.push('');
    if (m.missionNumber) lines.push('Numéro de mission : ' + m.missionNumber);
    lines.push('Date : ' + isoToFrDate(m.missionDate));
    if (m.destination) lines.push('Destination : ' + m.destination);
    lines.push('Chauffeur : ' + (m.driver || '-'));
    lines.push('Kilométrage départ : ' + fmtKm(m.kmStart));
    lines.push('Kilométrage fin : ' + fmtKm(m.kmEnd));
    if (distance) lines.push('Distance parcourue : ' + distance);
    lines.push('Plein effectué : ' + fuelSummary(m));
    lines.push('');
    lines.push('Équipement présent :');
    Object.keys(eqLabels).forEach(function(k){
      lines.push('- ' + eqLabels[k] + ' : ' + (eq[k] ? 'Oui' : 'Non'));
    });
    lines.push('');
    lines.push('État du véhicule : ' + (stateLabels[m.stateLevel] || '-'));
    lines.push('Remarques : ' + (m.stateNotes || '(aucune)'));
    if (m.photos && m.photos.length){
      lines.push('');
      lines.push('(Fiche PDF en pièce jointe, avec ' + m.photos.length + ' photo(s) du dégât en annexe)');
    } else {
      lines.push('');
      lines.push('(Fiche PDF en pièce jointe)');
    }
    return lines.join('\n');
  }

  function sniffImageExt(dataUrl){
    try {
      var comma = dataUrl.indexOf(',');
      var b64 = comma !== -1 ? dataUrl.slice(comma + 1) : dataUrl;
      var head = atob(b64.slice(0, 8));
      if (head.charCodeAt(0) === 0xFF && head.charCodeAt(1) === 0xD8) return 'jpg';
      if (head.charCodeAt(0) === 0x89 && head.charCodeAt(1) === 0x50) return 'png';
    } catch(e){}
    return 'jpg';
  }

  function errDetail(err){
    try { return (err && (err.message || err.errorMessage)) ? (err.message || err.errorMessage) : JSON.stringify(err); }
    catch(e){ return String(err); }
  }


  // ---------- activation guidée de l'envoi automatique (autorisation SMS) ----------
  // Android interdit à une app d'activer elle-même les "paramètres restreints" :
  // l'app ouvre donc directement la bonne page des réglages, puis redemande
  // l'autorisation SMS dès le retour dans l'app.
  var SMS_TRIED_KEY = "carnet_de_bord_sms_setup_tried";
  var waitingSettingsReturn = false;
  var guideAttempts = 0;

  function smsPlugin(){ return hasSmsComposer() ? getNativeSmsComposer() : null; }

  function isSmsGranted(){
    var P = smsPlugin();
    if (!P || typeof P.checkPermissions !== 'function') return Promise.resolve(true);
    return P.checkPermissions().then(function(r){ return !!r && r.sms === 'granted'; })
      .catch(function(){ return false; });
  }

  function requestSms(){
    var P = smsPlugin();
    if (!P || typeof P.requestPermissions !== 'function') return Promise.resolve(false);
    return P.requestPermissions({ permissions: ['sms'] })
      .then(function(r){ return !!r && r.sms === 'granted'; })
      .catch(function(){ return false; });
  }

  function refreshSmsSetup(){
    var box = document.getElementById('smsSetup');
    if (!box) return;
    if (!smsPlugin()){ box.hidden = true; return; }
    isSmsGranted().then(function(ok){
      if (ok){ box.hidden = true; box.innerHTML = ""; return; }
      box.hidden = false;
      box.innerHTML =
        '<div class="sms-setup">' +
          '<div><b>Envoi automatique non activé</b>' +
          '<span>Autorisez l\'envoi des SMS pour que les fiches partent seules.</span></div>' +
          '<button class="btn btn-primary btn-sm" id="btnSmsSetup">Activer</button>' +
        '</div>';
      document.getElementById('btnSmsSetup').addEventListener('click', startSmsSetup);
    });
  }

  function smsSetupDone(){
    waitingSettingsReturn = false;
    guideAttempts = 0;
    var root = document.getElementById('modalRoot');
    if (document.getElementById('smsGuide')) root.innerHTML = "";
    showToast('Envoi automatique activé.', 3500);
    refreshSmsSetup();
  }

  // Étape 1 : demande classique. Si Android la bloque, on passe au guide.
  function startSmsSetup(){
    requestSms().then(function(ok){
      try { localStorage.setItem(SMS_TRIED_KEY, '1'); } catch(e){}
      if (ok) smsSetupDone();
      else showSmsGuide();
    });
  }

  function showSmsGuide(){
    var root = document.getElementById('modalRoot');
    var extra = guideAttempts > 0
      ? '<p class="guide-tip">L\'option n\'apparaît pas dans le menu ⋮ ? Sur la page des réglages, ouvrez d\'abord <b>Autorisations &gt; SMS</b> et appuyez sur <b>Autoriser</b> : Android affiche un avertissement, fermez-le. Revenez ensuite sur la page précédente : l\'option est alors dans le menu ⋮.</p>'
      : '';
    root.innerHTML =
      '<div class="modal-backdrop" id="smsGuide">' +
        '<div class="modal">' +
          '<h3>Activer l\'envoi automatique</h3>' +
          '<p>Android bloque l\'autorisation SMS pour les applications installées hors du Play Store. Une seule manipulation suffit :</p>' +
          '<ol class="guide-steps">' +
            '<li>Appuyez sur <b>Ouvrir les réglages</b> ci-dessous.</li>' +
            '<li>Sur la page qui s\'ouvre, touchez les <b>⋮</b> en haut à droite puis <b>Autoriser les paramètres restreints</b>, et confirmez.</li>' +
            '<li>Revenez dans Carnet de bord : l\'app vous demandera l\'autorisation SMS, appuyez sur <b>Autoriser</b>.</li>' +
          '</ol>' + extra +
          '<div class="modal-actions">' +
            '<button class="btn" id="guideLater">Plus tard</button>' +
            '<button class="btn btn-primary" id="guideOpen">Ouvrir les réglages</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('guideLater').addEventListener('click', function(){
      waitingSettingsReturn = false;
      root.innerHTML = "";
    });
    document.getElementById('guideOpen').addEventListener('click', function(){
      var P = smsPlugin();
      if (!P || typeof P.openAppSettings !== 'function'){
        showToast('Ouvrez Paramètres > Applications > Carnet de bord.', 5000);
        return;
      }
      waitingSettingsReturn = true;
      P.openAppSettings().catch(function(err){
        waitingSettingsReturn = false;
        window.alert("Ouverture des réglages impossible :\n" + errDetail(err) + "\n\nOuvrez Paramètres > Applications > Carnet de bord.");
      });
    });
  }

  // Étape 2 : au retour des réglages, on redemande aussitôt l'autorisation SMS
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') return;
    if (waitingSettingsReturn){
      waitingSettingsReturn = false;
      setTimeout(function(){
        requestSms().then(function(ok){
          if (ok){ smsSetupDone(); }
          else { guideAttempts++; showSmsGuide(); }
        });
      }, 400);
    } else {
      refreshSmsSetup();
    }
  });

  var sendingInProgress = false;

  // ---------- journal des derniers envois (visible dans les paramètres) ----------
  var SEND_LOG_KEY = "carnet_de_bord_send_log";
  function getSendLog(){
    try { return JSON.parse(localStorage.getItem(SEND_LOG_KEY) || '[]'); } catch(e){ return []; }
  }
  function addSendLog(entries){
    var log = entries.concat(getSendLog()).slice(0, 20);
    try { localStorage.setItem(SEND_LOG_KEY, JSON.stringify(log)); } catch(e){}
  }
  function logFromResults(m, results){
    var when = new Date().toISOString();
    addSendLog(results.map(function(r){
      return {
        at: when, plate: m.plate || '', to: r.to, ok: !!r.ok,
        attempts: r.attempts || null,
        info: r.ok ? (r.detail || '') : (r.error || ('code ' + r.code))
      };
    }));
  }

  // Envoi 100 % automatique : l'app fabrique et envoie elle-même un MMS par
  // adresse (fiche PDF jointe), sans ouvrir l'application Messages.
  function sendMissionBySms(m){
    var emails = getDestEmails();
    var rejected = [getDestEmail(), getDestEmail2()].filter(function(e){ return !!e && !isAllowedEmail(e); });
    if (rejected.length){
      window.alert("Adresse(s) non autorisée(s) :\n" + rejected.join('\n') +
        "\n\nSeules les adresses @justice.fr sont acceptées. Corrigez-les dans les paramètres.");
      openSettingsModal(function(){ sendMissionBySms(m); });
      return;
    }
    if (!emails.length){
      showToast("Définissez d'abord l'adresse email de destination.");
      openSettingsModal(function(){ sendMissionBySms(m); });
      return;
    }
    if (sendingInProgress){ showToast('Envoi déjà en cours…'); return; }

    if (!hasSmsComposer()){
      showToast("L'envoi automatique n'est possible que dans l'application Android.");
      return;
    }
    var SmsComposer = getNativeSmsComposer();
    var btn = document.getElementById('btnSave');
    function setBusy(busy){
      sendingInProgress = busy;
      if (btn){ btn.disabled = busy; btn.textContent = busy ? 'Envoi en cours…' : 'Valider et envoyer'; }
    }

    setBusy(true);
    showToast('Préparation du PDF…');
    var rawName = m.missionNumber ? m.missionNumber : (m.plate || 'sans_numero');
    var pdfFilename = rawName.replace(/[\\/:*?"<>|]+/g, '-') + '.pdf';
    var text = buildMessageBodyText(m);
    var subject = 'Fiche mission ' + (m.plate || '') + (m.missionNumber ? ' - ' + m.missionNumber : '');
    var attachments = [];

    buildStyledMissionPDFAsync(m).then(function(doc){
      return appendPhotoPagesAsync(doc, m);
    }).then(function(doc){
      return doc ? blobToBase64(doc.output('blob')) : null;
    }).then(function(b64){
      if (b64) attachments.push({ data: b64, name: pdfFilename });
      showToast(emails.length > 1 ? 'Envoi des 2 MMS en cours… (jusqu\'à 1 minute)' : 'Envoi du MMS en cours…', 180000);
      return SmsComposer.sendMms({ to: emails, subject: subject.trim(), body: text, attachments: attachments });
    }).then(function(res){
      setBusy(false);
      var results = (res && res.results) || [];
      logFromResults(m, results);
      var ok = results.filter(function(r){ return r.ok; });
      var failed = results.filter(function(r){ return !r.ok; });
      if (!failed.length){
        m.lastSentAt = new Date().toISOString();
        saveMissions();
        showToast(ok.length > 1
          ? 'Fiche envoyée par MMS aux 2 adresses.'
          : 'Fiche envoyée par MMS à ' + ok[0].to + '.', 5000);
        return;
      }
      showToast('Envoi incomplet : détail dans Paramètres > Derniers envois.', 5000);
      var msg = (ok.length ? 'Envoyé à : ' + ok.map(function(r){ return r.to; }).join(', ') + '\n\n' : '') +
        'Échec pour :\n' + failed.map(function(r){ return '• ' + r.to + ' — ' + (r.error || ('code ' + r.code)); }).join('\n') +
        '\n\nOuvrir l\'application Messages pour envoyer manuellement ?';
      if (window.confirm(msg)) openMessagesFallback(SmsComposer, failed.map(function(r){ return r.to; }), text, attachments);
    }).catch(function(err){
      setBusy(false);
      if (err && err.code === 'PERMISSION_DENIED'){
        showSmsGuide();
        return;
      }
      showToast("Échec de l'envoi : détail dans Paramètres > Derniers envois.", 5000);
      console.error('sendMms failed', err);
      addSendLog([{ at: new Date().toISOString(), plate: m.plate || '', to: emails.join(', '), ok: false, info: errDetail(err) }]);
      var msg = "L'envoi automatique a échoué :\n" + errDetail(err) + "\n\nOuvrir l'application Messages pour envoyer manuellement ?";
      if (window.confirm(msg)) openMessagesFallback(SmsComposer, emails, text, attachments);
    });
  }

  // Secours : ouvre Messages (une adresse à la fois, sinon le PDF n'est pas joint)
  function openMessagesFallback(SmsComposer, addresses, text, attachments){
    var list = addresses.slice();
    function next(){
      if (!list.length) return;
      var to = list.shift();
      SmsComposer.composeSms({ to: to, body: text, attachments: attachments })
        .then(function(){
          if (list.length){
            var onBack = function(){
              if (document.visibilityState !== 'visible') return;
              document.removeEventListener('visibilitychange', onBack);
              setTimeout(function(){
                if (window.confirm('Envoyer maintenant à ' + list[0] + ' ?')) next();
              }, 300);
            };
            document.addEventListener('visibilitychange', onBack);
          }
        })
        .catch(function(err){ window.alert("Ouverture de Messages impossible :\n" + errDetail(err)); });
    }
    next();
  }

  // ---------- wiring: global ----------
  document.getElementById('btnSettings').addEventListener('click', function(){ openSettingsModal(); });
  document.getElementById('btnDisplay').addEventListener('click', openDisplayModal);
  document.getElementById('btnNewTop').addEventListener('click', createMission);

  // Autosave lightly on blur of key fields to reduce data loss risk
  document.addEventListener('blur', function(e){
    var t = e.target;
    if (!t) return;
    var isExtraFuel = t.classList && t.classList.contains('extra-fuel-input');
    if (isExtraFuel || (t.id && ['f-missionnum','f-missiondate','f-destination','f-plate','f-driver','f-kmstart','f-kmend','f-fuelkm','f-notes'].indexOf(t.id) !== -1)){
      var m = missions.find(function(x){ return x.id === activeId; });
      if (m) persistForm(m);
    }
  }, true);

  // ---------- init ----------
  loadMissions();
  renderAll();
  refreshSmsSetup();

  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(function(cap){ downloadsCap = cap; }).catch(function(){});
  }

  // Enables offline use once hosted (e.g. on Netlify) and wrapped as an app
  // (e.g. via Median.co): the app needs to be opened once with a connection
  // so the service worker can cache it, then it keeps working offline.
  // Silently does nothing where unsupported or not served over http(s)
  // (such as this Claude preview).
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
