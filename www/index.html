<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de bord — Fiches véhicules</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #EDEEF0;
    --panel: #FFFFFF;
    --panel-2: #F5F6F7;
    --border: #D7DADE;
    --text: #1A1D21;
    --text-muted: #62686F;
    --accent: #C9860E;
    --accent-strong: #A66E0A;
    --accent-ink: #24160A;
    --danger: #B5392C;
    --danger-bg: #FBEAE7;
    --success: #2F7D53;
    --success-bg: #E8F3EC;
    --warn-bg: #FBF1DE;
    --shadow: 0 1px 2px rgba(20,22,25,.06), 0 6px 20px rgba(20,22,25,.05);
    --radius: 3px;
    --mono-tag: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body-font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171A;
      --panel: #1D2024;
      --panel-2: #24272C;
      --border: #34383E;
      --text: #ECEDEE;
      --text-muted: #9BA1A8;
      --accent: #E6A93A;
      --accent-strong: #F0BA5A;
      --accent-ink: #1C1204;
      --danger: #E2685A;
      --danger-bg: #3A2220;
      --success: #5BB784;
      --success-bg: #1E332A;
      --warn-bg: #3A2F17;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171A;
    --panel: #1D2024;
    --panel-2: #24272C;
    --border: #34383E;
    --text: #ECEDEE;
    --text-muted: #9BA1A8;
    --accent: #E6A93A;
    --accent-strong: #F0BA5A;
    --accent-ink: #1C1204;
    --danger: #E2685A;
    --danger-bg: #3A2220;
    --success: #5BB784;
    --success-bg: #1E332A;
    --warn-bg: #3A2F17;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  @media (max-width: 400px) {
    .topbar-inner { padding-left: 12px; padding-right: 12px; }
    main.layout { padding-left: 12px; padding-right: 12px; }
    .form-head, .form-body { padding-left: 14px; padding-right: 14px; }
    .save-bar { padding-left: 14px; padding-right: 14px; }
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  a { color: inherit; }

  /* ---------- Layout shell ---------- */
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header.topbar {
    padding: env(safe-area-inset-top, 0px) 0 0 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .topbar-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius);
    font: inherit;
    max-width: 100%;
  }
  .brand-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; overflow: hidden; }
  .brand:hover { background: var(--panel-2); }
  .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .brand-mark {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: transparent;
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono-tag);
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
    letter-spacing: 0.5px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border);
  }
  .brand-logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .brand h1 {
    font-family: var(--mono-tag);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.2px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .brand .sub {
    color: var(--text-muted);
    font-size: 12.5px;
  }
  .topbar-actions { display: flex; justify-content: center; }

  .stat-row {
    display: flex;
    gap: 18px;
    padding: 0 20px 14px;
    max-width: 1240px;
    margin: 0 auto;
    width: 100%;
    overflow-x: auto;
  }
  .stat {
    flex: 0 0 auto;
    min-width: 108px;
    padding: 8px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .stat .num { font-family: var(--mono-tag); font-size: 22px; font-weight: 600; line-height: 1; }
  .stat .lbl { color: var(--text-muted); font-size: 11.5px; margin-top: 3px; }

  main.layout {
    flex: 1;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 20px 60px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 880px) {
    main.layout { grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .search-input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13.5px;
  }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .btn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--text-muted); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-danger { color: var(--danger); background: var(--panel-2); border-color: var(--border); }
  .btn-danger:hover { border-color: var(--danger); background: var(--danger-bg); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--panel-2); }
  .btn-sm { padding: 5px 9px; font-size: 12.5px; }
  .btn-block { width: 100%; }

  .mission-list {
    list-style: none;
    margin: 0; padding: 6px;
    overflow-y: auto;
    max-height: 62vh;
  }
  @media (max-width: 880px) { .mission-list { max-height: 40vh; } }

  .mission-card {
    padding: 10px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 4px;
  }
  .mission-card:hover { background: var(--panel-2); }
  .mission-card.active { background: var(--panel-2); border-color: var(--accent); }
  .mission-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .plate-chip {
    font-family: var(--mono-tag);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border: 1.5px solid var(--text);
    border-radius: 2px;
    background: var(--panel);
  }
  .mission-card .driver { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    flex-shrink: 0;
  }
  .badge.ongoing { background: var(--warn-bg); color: var(--accent-strong); }
  .badge.done { background: var(--success-bg); color: var(--success); }

  .empty-list {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---------- Main panel ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 60vh;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    text-align: center;
    padding: 30px;
    color: var(--text-muted);
    gap: 14px;
  }
  .empty-state .glyph { opacity: 0.5; display: flex; }
  .empty-state h2 { font-family: var(--mono-tag); font-weight: 600; font-size: 20px; color: var(--text); margin: 0; }
  .empty-state p { max-width: 320px; margin: 0; font-size: 13.5px; }

  .form-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }


  /* ---------- Thème sombre imposé + écran d'accueil avec sceau en filigrane ---------- */
  :root { --card-glass: rgba(255, 255, 255, 0.86); }
  :root[data-theme="dark"] { --card-glass: rgba(28, 31, 36, 0.82); }

  /* Logo retiré de l'en-tête : titre seul, centré (un appui ouvre les paramètres) */
  .brand-mark { display: none !important; }
  .brand { justify-content: center; }
  .brand-text { align-items: center !important; }

    position: relative;
    min-height: 62vh;
    isolation: isolate;
  }

  body.view-home .mission-list { position: relative; }
  body.view-home .mission-card {
    background: var(--card-glass);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
  }
  body.view-home .empty-list { display: none; }

  /* Roue dentée (réglages d'affichage) */
  header.topbar { position: relative; }
  .btn-gear {
    position: absolute;
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: 12px;
    width: 42px; height: 42px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
  }
  .btn-gear:active { background: var(--panel-2); }
  .seg-theme {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--panel-2); padding: 4px;
    border-radius: 10px; border: 1px solid var(--border);
  }
  .seg-theme button {
    border: 1px solid transparent; background: transparent; color: var(--text-muted);
    font: inherit; font-weight: 600; font-size: 14px;
    padding: 9px 8px; border-radius: 7px; cursor: pointer;
  }
  .seg-theme button.on {
    background: var(--panel); color: var(--text);
    border-color: var(--border); box-shadow: 0 1px 2px rgba(0,0,0,.25);
  }
  .pdf-preview { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); }
  .pdf-preview .band { border-radius: 4px; padding: 7px 10px; font-weight: 700; font-size: 10.5px; white-space: nowrap; }

  /* Mention discrète en bas de l'écran principal (texte fixe) */
  .credit { display: none; }
  body.view-home .credit {
    display: block;
    text-align: center;
    font-size: 11.5px;
    letter-spacing: 0.3px;
    color: var(--text-muted);
    opacity: 0.7;
    padding: 4px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  body.view-home main.layout { padding-bottom: 12px; }

  /* ---------- Deux écrans : liste (accueil) / fiche plein écran ---------- */
  body.view-home .panel { display: none; }
  body.view-home main.layout { grid-template-columns: 1fr; max-width: 720px; }
  body.view-home .mission-list { max-height: none; overflow: visible; }
  body.view-home .mission-card { padding: 14px 12px; }

  body.view-fiche header.topbar,
  body.view-fiche .sidebar { display: none; }
  body.view-fiche main.layout { grid-template-columns: 1fr; max-width: 900px; padding-top: 0; }
  body.view-fiche .panel { border-top: none; border-top-left-radius: 0; border-top-right-radius: 0; }
  body.view-fiche .form-head {
    position: sticky;
    top: 0;
    z-index: 15;
    background: var(--panel);
    padding-top: calc(12px + env(safe-area-inset-top, 0px));
    padding-bottom: 12px;
    margin-top: calc(-1 * env(safe-area-inset-top, 0px));
    justify-content: flex-start;
  }
  body.view-fiche .form-head { flex-wrap: nowrap; }
  body.view-fiche .form-head-title { min-width: 0; flex: 1 1 auto; }
  body.view-fiche .form-head .form-actions { margin-left: auto; flex: 0 0 auto; }
  @media (max-width: 600px) {
    body.view-fiche .form-head { padding-left: 12px; padding-right: 12px; gap: 8px; }
    body.view-fiche .form-head-title h2 { display: none; }
    body.view-fiche .form-head-title { gap: 6px; }
    body.view-fiche .form-head-title .plate-chip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 42vw; }
    body.view-fiche .autosave-status { font-size: 11px; }
  }
  .btn-back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 8px 12px 8px 8px;
    font-weight: 600;
  }
  @media (max-width: 880px) {
    body.view-fiche main.layout { padding-left: 0; padding-right: 0; }
    body.view-fiche .panel { border-left: none; border-right: none; border-radius: 0; }
  }
  .form-head-title { display: flex; align-items: center; gap: 10px; }
  .autosave-status { font-size: 12px; color: var(--success); opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .autosave-status.show { opacity: 1; }
  .form-head h2 {
    font-family: var(--mono-tag);
    font-weight: 600;
    font-size: 20px;
    margin: 0;
  }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .form-body { padding: 6px 20px 24px; }

  .section {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border-bottom: none; }
  .section-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 12px;
  }
  .section-num {
    font-family: var(--mono-tag);
    font-weight: 700;
    color: var(--accent-strong);
    font-size: 13px;
  }
  .section-title h3 {
    font-size: 13.5px;
    font-weight: 700;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
  .field input[type=text], .field input[type=email], .field input[type=number], .field input[type=date], .field select, .field textarea {
    padding: 10px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    font-size: 16px;
    width: 100%;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .plate-input { font-family: var(--mono-tag); font-weight: 600; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .hint { font-size: 11.5px; color: var(--text-muted); }

  .km-delta {
    grid-column: 1 / -1;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--text-muted);
  }
  .km-delta strong { color: var(--text); font-family: var(--mono-tag); font-size: 15px; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
  }
  .reminder-text {
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 600;
    margin: -4px 0 8px;
  }
  .switch {
    position: relative;
    width: 42px; height: 24px;
    flex-shrink: 0;
  }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 20px;
    transition: background .15s;
  }
  .switch .thumb {
    position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: var(--panel);
    border-radius: 50%;
    transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .thumb { transform: translateX(18px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .fuel-km-field { margin-top: 10px; }
  .extra-fuel-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .extra-fuel-row input {
    flex: 1;
    padding: 10px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    font-size: 16px;
  }
  .extra-fuel-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .extra-fuel-row .rm-fuel {
    width: 36px; height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--danger);
    cursor: pointer;
    font-size: 14px;
  }
  .extra-fuel-row .rm-fuel:hover { border-color: var(--danger); background: var(--danger-bg); }

  .check-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }
  @media (max-width: 380px) {
    .check-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .check-item.on { border-color: var(--success); background: var(--success-bg); }
  .check-item input { width: 17px; height: 17px; accent-color: var(--success); flex-shrink: 0; cursor: pointer; }
  .check-item span { font-size: 13.5px; font-weight: 600; }

  .state-select-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .state-pill {
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .state-pill[data-lvl="ok"].active { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .state-pill[data-lvl="minor"].active { background: var(--warn-bg); border-color: var(--accent-strong); color: var(--accent-strong); }
  .state-pill[data-lvl="damage"].active { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

  .photo-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    background: var(--panel-2);
  }
  .photo-zone:hover { border-color: var(--accent); }
  .photo-zone p { margin: 6px 0 0; font-size: 12.5px; color: var(--text-muted); }
  .photo-zone .icon { display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }
  .photo-thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .rm {
    position: absolute; top: 3px; right: 3px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(20,20,20,.7);
    color: #fff;
    border: none;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .lightbox {
    position: fixed; inset: 0;
    background: rgba(10,10,10,.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 30px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff; border: none;
    font-size: 18px; cursor: pointer;
  }

  .save-bar {
    position: sticky; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
  }
  .save-bar-actions {
    display: none;
    flex-wrap: wrap;
    gap: 10px;
  }
  .save-bar.revealed .save-bar-actions { display: flex; }
  .save-bar.revealed #saveHint { display: none; }
  @media (max-width: 560px) {
    .save-bar { flex-direction: column; align-items: stretch; }
    .save-bar-actions { flex-direction: column; }
    .save-bar #saveHint { margin-right: 0 !important; text-align: center; }
    .save-bar .btn { width: 100%; text-align: center; padding-top: 11px; padding-bottom: 11px; }
  }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 200;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,10,10,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 150;
    padding: 20px;
  }
  .modal {
    background: var(--panel);
    border-radius: var(--radius);
    max-width: 380px;
    width: 100%;
    padding: 20px;
    border: 1px solid var(--border);
  }
  .modal h3 { margin: 0 0 8px; font-family: var(--mono-tag); font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--text-muted); font-size: 13.5px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .settings-modal { max-height: calc(100vh - 40px); overflow-y: auto; }
  .settings-modal .opt { font-weight: normal; color: var(--text-muted); }
  .send-log { margin: 4px 0 16px; font-size: 13px; }
  .sms-setup {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 8px 8px 2px; padding: 12px;
    border-radius: var(--radius);
    background: var(--warn-bg);
    border: 1px solid var(--accent);
    font-size: 13px;
  }
  .sms-setup b { display: block; font-size: 14px; }
  .sms-setup span { color: var(--text-muted); }
  .sms-setup .btn { flex: 0 0 auto; }
  body.view-fiche #smsSetup { display: none; }
  .guide-steps { margin: 0 0 12px; padding-left: 20px; font-size: 14px; }
  .guide-steps li { margin-bottom: 8px; }
  .guide-tip { font-size: 13px; background: var(--panel-2); border-radius: var(--radius); padding: 10px; }
  .send-log summary { cursor: pointer; font-weight: 600; color: var(--text-muted); }
  .send-log ul { list-style: none; padding: 0; margin: 8px 0 0; }
  .send-log li { padding: 7px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px; }
  .send-log li b { font-weight: 600; word-break: break-all; }
  .send-log li.ok b { color: var(--success); }
  .send-log li.ko b { color: var(--danger); }
  .send-log li span { color: var(--text-muted); }
  .send-log li small { color: var(--text); word-break: break-word; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--border);
    position: relative; overflow: hidden; flex: 0 0 auto;
  }
  .swatch.selected { box-shadow: 0 0 0 2px var(--text); }
  .swatch-custom {
    display: inline-flex; align-items: center; justify-content: center;
    background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935);
  }
  .swatch-custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

        ' /Height ' + imgData.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8' +
        ' /Length ' + imgData.rgbRaw.length + ' >>\nstream\n';

  };

    var fontRegularId = this._addObject(strToBytes(
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'
    ));
    var fontBoldId = this._addObject(strToBytes(
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'
    ));

      var streamStr = page.content.join('\n');

        strToBytes('<< /Length ' + streamBytes.length + ' >>\nstream\n'),
        streamBytes,
        strToBytes('\nendstream')
      ]);

        return '/' + name + ' ' + page.imageIds[name] + ' 0 R';

      var resources = '<< /Font << /F1 ' + fontRegularId + ' 0 R /F2 ' + fontBoldId + ' 0 R >>' +
        (imgRefs ? ' /XObject << ' + imgRefs + ' >>' : '') + ' >>';

      var pageDict = '<< /Type /Page /Parent ' + pagesId + ' 0 R /Resources ' + resources +
        ' /MediaBox [0 0 ' + fmt(PAGE_W_MM * MM) + ' ' + fmt(PAGE_H_MM * MM) + ']' +
        ' /Contents ' + contentId + ' 0 R >>';

    var maxId = this._nextId - 1;
    var xrefBody = '0000000000 65535 f \n';

      ' 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF';
    chunks.push(strToBytes(trailerStr));

    if (type === 'bytes') return full;
    if (typeof Blob !== 'undefined') return new Blob([full], { type: 'application/pdf' });

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "carnet_de_bord_missions_v1";
  var EMAIL_KEY = "carnet_de_bord_dest_email";
  var missions = [];
  var activeId = null;
  var MAX_MISSIONS = 4;

  // Ne garde que les 4 fiches les plus récentes : les plus anciennes sont supprimées
  function pruneMissions(){
    if (missions.length <= MAX_MISSIONS) return false;
    missions.sort(function(a,b){ return b.createdAt - a.createdAt; });
    missions = missions.slice(0, MAX_MISSIONS);
    return true;
  }

  function getDestEmail(){
    try { return localStorage.getItem(EMAIL_KEY) || ""; } catch(e){ return ""; }
  }
  function setDestEmail(v){
    try { localStorage.setItem(EMAIL_KEY, v); return true; } catch(e){ return false; }
  }
  var EMAIL2_KEY = "carnet_de_bord_dest_email2";
  var ORIGIN_KEY = "carnet_de_bord_origin";
  var ACCENT_KEY = "carnet_de_bord_accent";
  var DEFAULT_ORIGIN = "PREJ Marseille";
  var DEFAULT_ACCENT = "#C9860E";

  function lsGet(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ return false; } }
  function getDestEmail2(){ return lsGet(EMAIL2_KEY); }
  function getDestEmails(){
    return [getDestEmail(), getDestEmail2()].filter(function(e){ return !!e && isAllowedEmail(e); });
  }
  function getOrigin(){ return lsGet(ORIGIN_KEY) || DEFAULT_ORIGIN; }
  function validHex(v){ return /^#[0-9a-fA-F]{6}$/.test(v || '') ? v.toUpperCase() : ''; }
  // Couleur du PDF : réglée par le responsable (reprend l'ancienne couleur unique)
  function getPdfAccent(){ return validHex(lsGet(ACCENT_KEY)) || DEFAULT_ACCENT; }
  // Couleur de l'écran : réglée par chaque utilisateur (roue dentée)
  var SCREEN_ACCENT_KEY = "carnet_de_bord_screen_accent";
  var THEME_KEY = "carnet_de_bord_theme";
  function getScreenAccent(){ return validHex(lsGet(SCREEN_ACCENT_KEY)) || validHex(lsGet(ACCENT_KEY)) || DEFAULT_ACCENT; }
  function getTheme(){ return lsGet(THEME_KEY) === 'light' ? 'light' : 'dark'; }
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.style.colorScheme = theme;
    var meta = document.querySelector('meta[name="color-scheme"]');
    if (meta) meta.setAttribute('content', theme);
  }

  // ---------- couleur d'accent personnalisable ----------
  function hexToRgb(hex){
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(rgb){
    return '#' + rgb.map(function(c){
      c = Math.max(0, Math.min(255, Math.round(c)));
      return (c < 16 ? '0' : '') + c.toString(16);
    }).join('').toUpperCase();
  }
  function mixRgb(a, b, t){ return [0,1,2].map(function(i){ return a[i] + (b[i] - a[i]) * t; }); }
  function luminance(rgb){
    var c = rgb.map(function(v){ v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  // Texte lisible (blanc ou foncé) posé sur la couleur d'accent
  function inkFor(rgb){ return luminance(rgb) > 0.4 ? [24, 20, 16] : [255, 255, 255]; }

  function accentPalette(hex){
    var base = hexToRgb(hex);
    var black = [0,0,0], white = [255,255,255];
    return {
      base: base,
      strong: mixRgb(base, black, 0.18),
      ink: inkFor(base),
      warnBg: mixRgb(base, white, 0.86),
      darkBase: mixRgb(base, white, 0.22),
      darkStrong: mixRgb(base, white, 0.38),
      darkInk: inkFor(mixRgb(base, white, 0.22)),
      darkWarnBg: mixRgb(base, [21, 23, 26], 0.78)
    };
  }

  function applyAccent(hex){
    var p = accentPalette(hex);
    var light = '--accent:' + rgbToHex(p.base) + ';--accent-strong:' + rgbToHex(p.strong) +
      ';--accent-ink:' + rgbToHex(p.ink) + ';--warn-bg:' + rgbToHex(p.warnBg) + ';';
    var dark = '--accent:' + rgbToHex(p.darkBase) + ';--accent-strong:' + rgbToHex(p.darkStrong) +
      ';--accent-ink:' + rgbToHex(p.darkInk) + ';--warn-bg:' + rgbToHex(p.darkWarnBg) + ';';
    var css = ':root{' + light + '}' +
      '@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){' + dark + '}}' +
      ':root[data-theme="dark"]{' + dark + '}';
    var tag = document.getElementById('customAccentStyle');
    if (!tag){
      tag = document.createElement('style');
      tag.id = 'customAccentStyle';
      document.head.appendChild(tag);

  // Couleur du PDF uniquement (n'affecte pas l'écran)
  function applyPdfAccent(hex){
    var p = accentPalette(hex);
    if (typeof PDF_COLORS !== 'undefined'){

      PDF_COLORS.accentStrong = p.strong.map(Math.round);

  }

  // Seules les adresses du domaine justice.fr sont acceptées
  var ALLOWED_DOMAIN = "justice.fr";
  function isAllowedEmail(v){
    v = String(v || '').trim().toLowerCase();
    return isValidEmail(v) && v.slice(-(ALLOWED_DOMAIN.length + 1)) === '@' + ALLOWED_DOMAIN;
  }

  function isValidEmail(v){
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  // ---------- persistence ----------
  function loadMissions(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      missions = raw ? JSON.parse(raw) : [];
      if (pruneMissions()) saveMissions();
    } catch(e){
      console.error("Lecture impossible", e);
      missions = [];
    }
  }
  function saveMissions(){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(missions));
      return true;
    } catch(e){
      console.error("Enregistrement impossible", e);
      showToast("Stockage plein : impossible d'enregistrer (essayez de retirer des photos).");
      return false;
    }
  }

  function uid(){ return 'm_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

  function todayISODate(){
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function isoToFrDate(iso){
    if (!iso) return "";
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function blankMission(){
    return {
      id: uid(),
      createdAt: Date.now(),
      missionNumber: "",
      missionDate: todayISODate(),
      destination: "",
      plate: "",
      driver: "",
      kmStart: "",
      kmEnd: "",
      fuelDone: false,
      fuelKm: "",
      extraFuels: [],
      equipment: { fuelCard: false, telepeage: false, bouclier: false, pareBalle: false, sac: false, ceinture: false, entrave: false },
      stateLevel: "ok",
      stateNotes: "",
      photos: []
    };
  }

  // ---------- toast ----------
  var toastTimer = null;
  function showToast(msg, duration){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, duration || 2600);
  }

  // ---------- helpers ----------
  function esc(s){
    var d = document.createElement('div');
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }
  function fmtKm(v){
    if (v === "" || v === null || v === undefined || isNaN(v)) return "—";
    return Math.round(Number(v)) + " km";
  }
  function fmtKmNumber(v){
    if (v === "" || v === null || v === undefined || isNaN(v)) return "—";
    return String(Math.round(Number(v)));
  }
  function fuelSummary(m){
    if (!m.fuelDone) return 'Non';
    var extras = (m.extraFuels || []).filter(function(v){ return v !== "" && v !== null && v !== undefined && !isNaN(v); });
    var text = 'Oui, au ' + fmtKm(m.fuelKm);
    if (extras.length){
      text += ' + plein(s) suppl. au ' + extras.map(function(v){ return fmtKm(v); }).join(', ');
    }
    return text;
  }
  function fmtDate(ts){
    try { return new Date(ts).toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'}); }
    catch(e){ return ""; }
  }
  function isDone(m){
    return m.kmEnd !== "" && m.kmEnd !== null && m.kmEnd !== undefined;
  }
  function equipCount(m){
    var eq = m.equipment || {};
    var keys = ['fuelCard','telepeage','bouclier','pareBalle','sac','ceinture','entrave'];
    var n = 0;
    keys.forEach(function(k){ if (eq[k]) n++; });
    return n;
  }

  // ---------- rendering: list ----------
  function renderList(){
    var list = document.getElementById('missionList');
    var filtered = missions
      .slice()
      .sort(function(a,b){ return b.createdAt - a.createdAt; });

    if (filtered.length === 0){
      list.innerHTML = '<li class="empty-list">' +
        "Aucune fiche pour l'instant.<br>Créez la première mission." +

    }

    list.innerHTML = filtered.map(function(m){
      var active = m.id === activeId ? ' active' : '';
      var done = isDone(m);
      return '<li class="mission-card' + active + '" data-id="' + m.id + '">' +
        '<div class="row1">' +
          '<span class="plate-chip">' + (esc(m.plate) || "—") + '</span>' +

  // ---------- image compression (in-memory only, never offered as a download) ----------
  function compressImage(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 1100;
        var w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w > h){ h = Math.round(h * (maxDim / w)); w = maxDim; }
          else { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.62);
        cb(dataUrl);
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

  var scrollRevealObserver = null;
  function wireScrollReveal(){
    if (scrollRevealObserver){ scrollRevealObserver.disconnect(); scrollRevealObserver = null; }
    var sentinel = document.getElementById('scrollSentinel');
    var saveBar = document.getElementById('saveBar');
    if (!sentinel || !saveBar) return;
    scrollRevealObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          saveBar.classList.add('revealed');
        }
      });
    }, { threshold: 0.01 });
    scrollRevealObserver.observe(sentinel);
  }

  function syncExtraFuelsFromDom(m){

    document.getElementById('btnDelete').addEventListener('click', function(){ confirmDelete(m.id); });

    var fuelToggle = document.getElementById('f-fueldone');
    fuelToggle.addEventListener('change', function(){
      document.getElementById('fuelKmWrap').style.display = fuelToggle.checked ? '' : 'none';
    });

    wireExtraFuelEvents(m);
    document.getElementById('btnAddFuel').addEventListener('click', function(){
      syncExtraFuelsFromDom(m);
      m.extraFuels.push("");
      document.getElementById('extraFuelList').innerHTML = renderExtraFuels(m);
      wireExtraFuelEvents(m);
      var newInputs = document.querySelectorAll('.extra-fuel-input');
      if (newInputs.length) newInputs[newInputs.length - 1].focus();
    });

    // Le <label> coche déjà la case nativement : on se contente de suivre son état
    Array.prototype.forEach.call(document.querySelectorAll('.check-item'), function(item){
      var cb = item.querySelector('input');
      cb.addEventListener('change', function(){
        item.classList.toggle('on', cb.checked);
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('.state-pill'), function(btn){
      btn.addEventListener('click', function(){
        Array.prototype.forEach.call(document.querySelectorAll('.state-pill'), function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        btn.dataset.selected = "1";
      });
    });

    var photoInput = document.getElementById('f-photoInput');
    photoInput.addEventListener('change', function(){
      var files = Array.prototype.slice.call(photoInput.files || []);
      if (files.length === 0) return;
      showToast('Traitement des photos…');
      var remaining = files.length;
      files.forEach(function(file){
        compressImage(file, function(dataUrl){
          remaining--;
          if (dataUrl){
            m.photos.push({ id: uid(), dataUrl: dataUrl });
            document.getElementById('photoGrid').innerHTML = renderPhotos(m);
            wirePhotoRemoval(m);
          }
          if (remaining === 0){
            photoInput.value = "";
            scheduleAutoSave(m);
          }
        });
      });
    });
    wirePhotoRemoval(m);

    document.getElementById('btnSave').addEventListener('click', function(){ validateAndSend(m); });
    wireAutoSave(m);
    document.getElementById('btnBack').addEventListener('click', goHome);
  }

  function wirePhotoRemoval(m){
    Array.prototype.forEach.call(document.querySelectorAll('[data-rm]'), function(btn){
      btn.addEventListener('click', function(e){

        document.getElementById('photoGrid').innerHTML = renderPhotos(m);
        wirePhotoRemoval(m);
        scheduleAutoSave(m);

  function persistForm(m){
    m.missionNumber = document.getElementById('f-missionnum').value.trim();
    m.missionDate = document.getElementById('f-missiondate').value;
    m.destination = document.getElementById('f-destination').value.trim();
    m.plate = document.getElementById('f-plate').value.trim().toUpperCase();
    m.driver = document.getElementById('f-driver').value.trim();
    var ks = document.getElementById('f-kmstart').value;
    var ke = document.getElementById('f-kmend').value;
    m.kmStart = ks === "" ? "" : Number(ks);
    m.kmEnd = ke === "" ? "" : Number(ke);
    m.fuelDone = document.getElementById('f-fueldone').checked;
    var fk = document.getElementById('f-fuelkm').value;
    m.fuelKm = (m.fuelDone && fk !== "") ? Number(fk) : "";
    var extraFuelInputs = document.querySelectorAll('.extra-fuel-input');
    m.extraFuels = Array.prototype.map.call(extraFuelInputs, function(inp){
      return inp.value !== "" ? Number(inp.value) : "";
    });
    m.equipment = {
      fuelCard: document.querySelector('[data-eq="fuelCard"]').checked,
      telepeage: document.querySelector('[data-eq="telepeage"]').checked,
      bouclier: document.querySelector('[data-eq="bouclier"]').checked,
      pareBalle: document.querySelector('[data-eq="pareBalle"]').checked,
      sac: document.querySelector('[data-eq="sac"]').checked,
      ceinture: document.querySelector('[data-eq="ceinture"]').checked,
      entrave: document.querySelector('[data-eq="entrave"]').checked
    };
    m.stateLevel = getSelectedStateLevel();
    m.stateNotes = document.getElementById('f-notes').value.trim();

    var idx = missions.findIndex(function(x){ return x.id === m.id; });
    if (idx === -1) missions.push(m); else missions[idx] = m;

    return saveMissions();
  }

  // ---------- sauvegarde automatique à chaque saisie ----------
  var autoSaveTimer = null;
  var autoSaveMission = null;

  function scheduleAutoSave(m){
    autoSaveMission = m;
    clearTimeout(autoSaveTimer);
    autoSaveTimer = setTimeout(flushAutoSave, 400);
  }

  // Enregistre immédiatement ce qui est en attente (avant de changer de fiche,
  // quand l'app passe en arrière-plan, etc.)
  function flushAutoSave(){
    clearTimeout(autoSaveTimer);
    autoSaveTimer = null;
    var m = autoSaveMission;
    autoSaveMission = null;
    if (!m || !document.getElementById('f-plate')) return;
    if (persistForm(m)){
      renderList();
      var chip = document.querySelector('.form-head-title .plate-chip');
      if (chip) chip.textContent = m.plate || 'NOUVELLE FICHE';
      var st = document.getElementById('autosaveStatus');
      if (st){
        st.textContent = '✓ Enregistré';
        st.classList.add('show');
        clearTimeout(st._t);
        st._t = setTimeout(function(){ st.classList.remove('show'); }, 1500);
      }
    }
  }

  function wireAutoSave(m){
    var panel = document.querySelector('.form-body');
    if (!panel) return;
    // Toute frappe ou modification d'un champ (texte, nombres, date, interrupteur, cases)
    panel.addEventListener('input', function(){ scheduleAutoSave(m); });
    panel.addEventListener('change', function(){ scheduleAutoSave(m); });
    // Boutons qui modifient la fiche sans événement "input" (état du véhicule,
    // équipements, ajout/suppression de plein ou de photo)
    panel.addEventListener('click', function(e){
      if (e.target.closest('.state-pill, .check-item, #btnAddFuel, .rm-fuel, [data-rm]')){
        setTimeout(function(){ scheduleAutoSave(m); }, 0);
      }
    });
    // Un champ quitté : on enregistre tout de suite
    panel.addEventListener('focusout', function(){
      if (autoSaveMission) flushAutoSave();
    });
  }

  // App mise en arrière-plan ou fermée : rien ne doit être perdu
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') flushAutoSave();
  });
  window.addEventListener('pagehide', flushAutoSave);

  function validateAndSend(m){
    clearTimeout(autoSaveTimer);
    autoSaveMission = null;
    var ok = persistForm(m);
    renderAll();
    if (ok){
      showToast('Fiche validée.');
      sendMissionBySms(m);
    }
  }

  function confirmDelete(id){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-backdrop" id="delBackdrop">' +
        '<div class="modal">' +
          '<h3>Supprimer cette fiche ?</h3>' +
          '<p>Cette action est définitive et supprimera aussi les photos associées.</p>' +
          '<div class="modal-actions">' +
            '<button class="btn" id="delCancel">Annuler</button>' +
            '<button class="btn btn-danger" id="delConfirm">Supprimer</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('delCancel').addEventListener('click', function(){ root.innerHTML = ""; });
    document.getElementById('delBackdrop').addEventListener('click', function(e){ if (e.target.id === 'delBackdrop') root.innerHTML = ""; });
    document.getElementById('delConfirm').addEventListener('click', function(){
      clearTimeout(autoSaveTimer);
      autoSaveMission = null;
      missions = missions.filter(function(m){ return m.id !== id; });
      if (activeId === id) activeId = null;
      saveMissions();
      root.innerHTML = "";
      showToast('Fiche supprimée.');
      renderAll();
    });
  }

  function createMission(){
    flushAutoSave();
    var m = blankMission();
    missions.push(m);
    pruneMissions();
    activeId = m.id;
    saveMissions();
    renderAll();
    window.scrollTo(0, 0);
    setTimeout(function(){
      var el = document.getElementById('f-plate');
      if (el) el.focus();
    }, 30);

  function renderAll(){
    var onFiche = !!activeId && missions.some(function(x){ return x.id === activeId; });
    if (!onFiche) activeId = null;
    document.body.classList.toggle('view-fiche', onFiche);
    document.body.classList.toggle('view-home', !onFiche);
    renderList();
    renderPanel();
    syncHistory(onFiche);
  }

  // Ouvre une fiche en plein écran
  function openMission(id){
    flushAutoSave();
    activeId = id;
    renderAll();
    window.scrollTo(0, 0);
  }

  // Retour à l'écran principal (liste des fiches)
  function goHome(){
    flushAutoSave();
    activeId = null;
    renderAll();
    window.scrollTo(0, 0);
  }

  // Bouton "retour" d'Android : une entrée d'historique est ajoutée quand une
  // fiche s'ouvre, le retour du téléphone ramène donc à la liste au lieu de
  // quitter l'application.
  var historyOnFiche = false;
  function syncHistory(onFiche){
    try {
      if (onFiche && !historyOnFiche){
        history.pushState({ fiche: true }, '');
        historyOnFiche = true;
      } else if (!onFiche && historyOnFiche){
        historyOnFiche = false;
        if (history.state && history.state.fiche) history.back();
      }
    } catch(e){}
  }
  window.addEventListener('popstate', function(){
    if (historyOnFiche){
      historyOnFiche = false;
      if (document.getElementById('modalRoot').innerHTML) document.getElementById('modalRoot').innerHTML = "";
      flushAutoSave();
      activeId = null;
      renderAll();
      window.scrollTo(0, 0);
    }
  });

  var SETTINGS_PASSWORD = "1402";

  function openPasswordGate(onSuccess){
    var root = document.getElementById('modalRoot');
    root.innerHTML =
      '<div class="modal-backdrop" id="pwBackdrop">' +
        '<div class="modal">' +
          '<h3>Accès protégé</h3>' +
          '<p>Entrez le mot de passe pour modifier les paramètres.</p>' +
          '<div class="field"><label for="pw-input">Mot de passe</label>' +
            '<input type="password" id="pw-input" placeholder="••••" autocomplete="off"></div>' +
          '<div class="modal-actions">' +
            '<button class="btn" id="pwCancel">Annuler</button>' +
            '<button class="btn btn-primary" id="pwConfirm">Valider</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    var input = document.getElementById('pw-input');
    document.getElementById('pwCancel').addEventListener('click', function(){ root.innerHTML = ""; });
    document.getElementById('pwBackdrop').addEventListener('click', function(e){ if (e.target.id === 'pwBackdrop') root.innerHTML = ""; });
    function check(){
      if (input.value === SETTINGS_PASSWORD){
        root.innerHTML = "";
        onSuccess();
      } else {
        showToast('Mot de passe incorrect.');
        input.value = "";
        input.focus();

  var PDF_COLORS = {
    accent: [201, 134, 14],
    accentStrong: [166, 110, 10],
    accentInk: [36, 22, 10],
    text: [26, 29, 33],
    muted: [98, 104, 111],
    border: [215, 218, 222],
    panel2: [245, 246, 247],
    success: [47, 125, 83],
    successBg: [232, 243, 236],
    danger: [181, 57, 44],

  function pdfSetFill(doc, rgb){ doc.setFillColor(rgb[0], rgb[1], rgb[2]); }
  function pdfSetDraw(doc, rgb){ doc.setDrawColor(rgb[0], rgb[1], rgb[2]); }
  function pdfSetText(doc, rgb){ doc.setTextColor(rgb[0], rgb[1], rgb[2]); }

  // ---------- photo format safety net for the PDF ----------
  // canvas.toDataURL('image/jpeg', ...) is supposed to always return real JPEG
  // bytes, but some Android WebViews silently return PNG bytes instead while
  // keeping the "image/jpeg" data: URL prefix. Embedding those bytes as if they
  // were JPEG produces a PDF that strict readers (e.g. on a PC) refuse to open,
  // even though lenient ones tolerate the mismatch. We verify the real format
  // via magic bytes and, if it isn't really JPEG, decode it through a canvas and
  // re-embed it as plain RGB pixel data instead (100% format-agnostic).
  function detectRealImageFormat(dataUrl){
    var comma = dataUrl.indexOf(',');
    var b64 = comma !== -1 ? dataUrl.slice(comma + 1) : dataUrl;
    var head = atob(b64.slice(0, 8));
    if (head.charCodeAt(0) === 0xFF && head.charCodeAt(1) === 0xD8) return 'jpeg';
    if (head.charCodeAt(0) === 0x89 && head.charCodeAt(1) === 0x50 && head.charCodeAt(2) === 0x4E && head.charCodeAt(3) === 0x47) return 'png';
    return 'unknown';
  }

  function preparePhotoForPdf(dataUrl){
    return new Promise(function(resolve){
      var realFormat;
      try { realFormat = detectRealImageFormat(dataUrl); } catch(e){ realFormat = 'unknown'; }
      if (realFormat === 'jpeg'){
        resolve(dataUrl);
        return;
      }
      // Not really JPEG: decode via canvas (the browser handles PNG/etc. for us)
      // and re-embed as raw RGB pixels, sidestepping the broken encoder entirely.
      var img = new Image();
      img.onload = function(){
        try {
          var canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var rgba = imgData.data;
          var rgb = new Uint8Array(canvas.width * canvas.height * 3);
          for (var p = 0, q = 0; p < rgba.length; p += 4, q += 3){
            rgb[q] = rgba[p]; rgb[q + 1] = rgba[p + 1]; rgb[q + 2] = rgba[p + 2];
          }
          if (typeof CompressionStream === 'function'){
            try {
              var cs = new CompressionStream('deflate');
              var writer = cs.writable.getWriter();
              writer.write(rgb);
              writer.close();
              new Response(cs.readable).arrayBuffer().then(function(buf){
                resolve({ rgbFlate: new Uint8Array(buf), width: canvas.width, height: canvas.height });
              }).catch(function(){
                resolve({ rgbRaw: rgb, width: canvas.width, height: canvas.height });
              });
              return;
            } catch(e){ /* fall through to uncompressed */ }
          }
          resolve({ rgbRaw: rgb, width: canvas.width, height: canvas.height });
        } catch(e){
          resolve(null);
        }
      };
      img.onerror = function(){ resolve(null); };
      img.src = dataUrl;
    });
  }

  function buildStyledMissionPDFAsync(m){
    var photos = m.photos || [];
    return Promise.all(photos.map(function(p){ return preparePhotoForPdf(p.dataUrl); }))
      .then(function(prepared){
        return buildStyledMissionPDF(m, prepared);
      });
  }

  // Photos du dégât ajoutées en annexe du PDF de la fiche (une photo par page,
  // en grand). Tout part ainsi dans UNE seule pièce jointe PDF : les photos ne
  // s'affichent plus dans le corps de l'email généré par l'opérateur, et Google
  // Messages accepte une pièce jointe unique avec le destinataire prérempli.
  function getImageSize(dataUrl){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 }); };
      img.onerror = function(){ resolve(null); };
      img.src = dataUrl;
    });
  }

  function appendPhotoPagesAsync(doc, m){
    var photos = m.photos || [];
    if (!doc || !photos.length) return Promise.resolve(doc);
    return Promise.all(photos.map(function(p){
      return Promise.all([preparePhotoForPdf(p.dataUrl), getImageSize(p.dataUrl)]);
    })).then(function(items){
      var pageW = doc.internal.pageSize.getWidth();
      var pageH = doc.internal.pageSize.getHeight();
      var margin = 12;
      var title = 'Fiche ' + (m.missionNumber ? m.missionNumber + ' - ' : '') + (m.plate || '');
      items.forEach(function(it, idx){
        doc.addPage();
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(26, 29, 33);
        doc.text('Annexe  —  ' + title + '  —  Photo ' + (idx + 1) + ' / ' + items.length, margin, margin + 4);
        var size = it[1] || { w: 4, h: 3 };
        var boxW = pageW - margin * 2;
        var boxH = pageH - margin * 2 - 10;
        var ratio = Math.min(boxW / size.w, boxH / size.h);
        var w = size.w * ratio, h = size.h * ratio;
        var x = margin + (boxW - w) / 2;
        var y = margin + 10;
        try {
          var imgData = it[0] != null ? it[0] : photos[idx].dataUrl;
          doc.addImage(imgData, 'AUTO', x, y, w, h);
        } catch(e){}
      });
      return doc;
    });
  }

  function buildStyledMissionPDF(m, preparedPhotos){
    var doc = new MiniPDF();
    var pageW = doc.internal.pageSize.getWidth();
    var pageH = doc.internal.pageSize.getHeight();
    var margin = 14;
    var C = PDF_COLORS;

    function addFooter(){
      var pageCount = doc.internal.getNumberOfPages();
      for (var p = 1; p <= pageCount; p++){
        doc.setPage(p);
        pdfSetDraw(doc, C.border);
        doc.setLineWidth(0.2);
        doc.line(margin, pageH - 12, pageW - margin, pageH - 12);
        pdfSetText(doc, C.muted);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(8);
        doc.text('Carnet de bord — Gestion de parc ' + getOrigin(), margin, pageH - 7);
        doc.text('Page ' + p + ' / ' + pageCount, pageW - margin, pageH - 7, { align: 'right' });
      }
    }

    function ensureSpace(y, needed){
      if (y + needed > pageH - 18){
        doc.addPage();
        return 20;
      }
      return y;
    }

    // ---- Header band ----
    pdfSetFill(doc, C.accent);
    doc.rect(0, 0, pageW, 24, 'F');
    var logoImg = document.querySelector('.brand-logo');
    if (logoImg && logoImg.src){
      try { doc.addImage(logoImg.src, 'PNG', margin, 4, 16, 16); } catch(e){}
    }
    pdfSetText(doc, C.onAccent);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(15);
    doc.text('Carnet de bord — Fiche mission', margin + 20, 11);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    doc.text('Gestion de parc — ' + getOrigin(), margin + 20, 17);

    var y = 33;

    // ---- Plate badge + mission number + status ----
    pdfSetDraw(doc, C.text);
    doc.setLineWidth(0.5);
    doc.roundedRect(margin, y, 42, 11, 1, 1);
    pdfSetText(doc, C.text);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(m.plate || '—', margin + 4, y + 7.5);

    var infoX = margin + 48;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    pdfSetText(doc, C.muted);
    if (m.missionNumber){
      doc.text('Mission n° ' + m.missionNumber, infoX, y + 4);
    }
    var done = m.kmEnd !== "" && m.kmEnd !== null && m.kmEnd !== undefined;
    var statusColor = done ? C.success : C.accentStrong;
    var statusBg = done ? C.successBg : C.warnBg;
    var statusLabel = done ? 'MISSION TERMINÉE' : 'MISSION EN COURS';
    pdfSetFill(doc, statusBg);
    doc.roundedRect(infoX, y + 6, 46, 6, 2, 2, 'F');
    pdfSetText(doc, statusColor);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7.5);
    doc.text(statusLabel, infoX + 23, y + 10, { align: 'center' });

    y += 18;

    // ---- Section helper ----
    var sectionNum = 0;
    function sectionTitle(title){
      sectionNum++;
      y = ensureSpace(y, 14);
      pdfSetFill(doc, C.accent);
      doc.roundedRect(margin, y, 7, 5.5, 1, 1, 'F');
      pdfSetText(doc, C.onAccent);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(String(sectionNum).padStart(2, '0'), margin + 3.5, y + 4, { align: 'center' });
      pdfSetText(doc, C.muted);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      doc.text(title.toUpperCase(), margin + 10, y + 4.3);
      y += 9;
      pdfSetDraw(doc, C.border);
      doc.setLineWidth(0.2);
      doc.line(margin, y, pageW - margin, y);
      y += 5;
    }

    function fieldRow(label, value, colX, colW){
      pdfSetText(doc, C.muted);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8);
      doc.text(label.toUpperCase(), colX, y);
      pdfSetText(doc, C.text);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10.5);
      var text = String(value == null || value === "" ? "-" : value);
      doc.text(text, colX, y + 5, { maxWidth: colW });
    }

    // ---- 01 Véhicule & chauffeur ----
    sectionTitle('Véhicule & chauffeur');
    var colW = (pageW - margin * 2 - 8) / 2;
    fieldRow('Numéro de mission', m.missionNumber, margin, colW);
    fieldRow('Date', isoToFrDate(m.missionDate), margin + colW + 8, colW);
    y += 12;
    fieldRow('Destination', m.destination, margin, colW);
    fieldRow('Chauffeur', m.driver, margin + colW + 8, colW);
    y += 12;

    // ---- 02 Kilométrage ----
    sectionTitle('Kilométrage');
    fieldRow('Départ mission', fmtKm(m.kmStart), margin, colW);
    fieldRow('Fin de mission', fmtKm(m.kmEnd), margin + colW + 8, colW);
    y += 10;
    if (m.kmStart !== "" && m.kmEnd !== "" && !isNaN(m.kmStart) && !isNaN(m.kmEnd)){
      var distance = fmtKmNumber(Number(m.kmEnd) - Number(m.kmStart)) + ' km';
      pdfSetFill(doc, C.panel2);
      doc.roundedRect(margin, y, pageW - margin * 2, 8, 1, 1, 'F');
      pdfSetText(doc, C.muted);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.text('Distance parcourue :', margin + 3, y + 5.3);
      pdfSetText(doc, C.text);

      y += 4;
    }

    // ---- 03 Carburant ----
    sectionTitle('Carburant');
    fieldRow('Plein effectué', fuelSummary(m), margin, pageW - margin * 2);
