<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de bord — Fiches véhicules</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #EDEEF0;
    --panel: #FFFFFF;
    --panel-2: #F5F6F7;
    --border: #D7DADE;
    --text: #1A1D21;
    --text-muted: #62686F;
    --accent: #C9860E;
    --accent-strong: #A66E0A;
    --accent-ink: #24160A;
    --danger: #B5392C;
    --danger-bg: #FBEAE7;
    --success: #2F7D53;
    --success-bg: #E8F3EC;
    --warn-bg: #FBF1DE;
    --shadow: 0 1px 2px rgba(20,22,25,.06), 0 6px 20px rgba(20,22,25,.05);
    --radius: 3px;
    --mono-tag: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body-font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171A;
      --panel: #1D2024;
      --panel-2: #24272C;
      --border: #34383E;
      --text: #ECEDEE;
      --text-muted: #9BA1A8;
      --accent: #E6A93A;
      --accent-strong: #F0BA5A;
      --accent-ink: #1C1204;
      --danger: #E2685A;
      --danger-bg: #3A2220;
      --success: #5BB784;
      --success-bg: #1E332A;
      --warn-bg: #3A2F17;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171A;
    --panel: #1D2024;
    --panel-2: #24272C;
    --border: #34383E;
    --text: #ECEDEE;
    --text-muted: #9BA1A8;
    --accent: #E6A93A;
    --accent-strong: #F0BA5A;
    --accent-ink: #1C1204;
    --danger: #E2685A;
    --danger-bg: #3A2220;
    --success: #5BB784;
    --success-bg: #1E332A;
    --warn-bg: #3A2F17;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 24px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  @media (max-width: 400px) {
    .topbar-inner { padding-left: 12px; padding-right: 12px; }
    main.layout { padding-left: 12px; padding-right: 12px; }
    .form-head, .form-body { padding-left: 14px; padding-right: 14px; }
    .save-bar { padding-left: 14px; padding-right: 14px; }
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  a { color: inherit; }

  /* ---------- Layout shell ---------- */
  .app {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }

  header.topbar {
    padding: env(safe-area-inset-top, 0px) 0 0 0;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  .topbar-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: var(--radius);
    font: inherit;
    max-width: 100%;
  }
  .brand-text { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; overflow: hidden; }
  .brand:hover { background: var(--panel-2); }
  .brand:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .brand-mark {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: transparent;
    color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono-tag);
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
    letter-spacing: 0.5px;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--border);
  }
  .brand-logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .brand h1 {
    font-family: var(--mono-tag);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.2px;
    margin: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .brand .sub {
    color: var(--text-muted);
    font-size: 12.5px;
  }
  .topbar-actions { display: flex; justify-content: center; }

  .stat-row {
    display: flex;
    gap: 18px;
    padding: 0 20px 14px;
    max-width: 1240px;
    margin: 0 auto;
    width: 100%;
    overflow-x: auto;
  }
  .stat {
    flex: 0 0 auto;
    min-width: 108px;
    padding: 8px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .stat .num { font-family: var(--mono-tag); font-size: 22px; font-weight: 600; line-height: 1; }
  .stat .lbl { color: var(--text-muted); font-size: 11.5px; margin-top: 3px; }

  main.layout {
    flex: 1;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    padding: 18px 20px 60px;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 880px) {
    main.layout { grid-template-columns: 1fr; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .sidebar-head {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .search-input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    font-size: 13.5px;
  }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .btn {
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--text-muted); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-danger { color: var(--danger); background: var(--panel-2); border-color: var(--border); }
  .btn-danger:hover { border-color: var(--danger); background: var(--danger-bg); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--panel-2); }
  .btn-sm { padding: 5px 9px; font-size: 12.5px; }
  .btn-block { width: 100%; }

  .mission-list {
    list-style: none;
    margin: 0; padding: 6px;
    overflow-y: auto;
    max-height: 62vh;
  }
  @media (max-width: 880px) { .mission-list { max-height: 40vh; } }

  .mission-card {
    padding: 10px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
    margin-bottom: 4px;
  }
  .mission-card:hover { background: var(--panel-2); }
  .mission-card.active { background: var(--panel-2); border-color: var(--accent); }
  .mission-card .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .plate-chip {
    font-family: var(--mono-tag);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border: 1.5px solid var(--text);
    border-radius: 2px;
    background: var(--panel);
  }
  .mission-card .driver { font-size: 12.5px; color: var(--text-muted); margin-top: 4px; }
  .badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    flex-shrink: 0;
  }
  .badge.ongoing { background: var(--warn-bg); color: var(--accent-strong); }
  .badge.done { background: var(--success-bg); color: var(--success); }

  .empty-list {
    padding: 30px 16px;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* ---------- Main panel ---------- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 60vh;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60vh;
    text-align: center;
    padding: 30px;
    color: var(--text-muted);
    gap: 14px;
  }
  .empty-state .glyph { opacity: 0.5; display: flex; }
  .empty-state h2 { font-family: var(--mono-tag); font-weight: 600; font-size: 20px; color: var(--text); margin: 0; }
  .empty-state p { max-width: 320px; margin: 0; font-size: 13.5px; }

  .form-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .form-head-title { display: flex; align-items: center; gap: 10px; }
  .form-head h2 {
    font-family: var(--mono-tag);
    font-weight: 600;
    font-size: 20px;
    margin: 0;
  }
  .form-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .form-body { padding: 6px 20px 24px; }

  .section {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .section:last-child { border-bottom: none; }
  .section-title {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 12px;
  }
  .section-num {
    font-family: var(--mono-tag);
    font-weight: 700;
    color: var(--accent-strong);
    font-size: 13px;
  }
  .section-title h3 {
    font-size: 13.5px;
    font-weight: 700;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-muted);
  }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }
  .field input[type=text], .field input[type=email], .field input[type=number], .field select, .field textarea {
    padding: 10px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    font-size: 16px;
    width: 100%;
  }
  .field textarea { resize: vertical; min-height: 64px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
  }
  .plate-input { font-family: var(--mono-tag); font-weight: 600; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .hint { font-size: 11.5px; color: var(--text-muted); }

  .km-delta {
    grid-column: 1 / -1;
    padding: 8px 10px;
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--text-muted);
  }
  .km-delta strong { color: var(--text); font-family: var(--mono-tag); font-size: 15px; }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 0;
  }
  .reminder-text {
    color: var(--danger);
    font-size: 12.5px;
    font-weight: 600;
    margin: -4px 0 8px;
  }
  .switch {
    position: relative;
    width: 42px; height: 24px;
    flex-shrink: 0;
  }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 20px;
    transition: background .15s;
  }
  .switch .thumb {
    position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px;
    background: var(--panel);
    border-radius: 50%;
    transition: transform .15s;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .thumb { transform: translateX(18px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .fuel-km-field { margin-top: 10px; }
  .extra-fuel-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .extra-fuel-row input {
    flex: 1;
    padding: 10px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    color: var(--text);
    font-size: 16px;
  }
  .extra-fuel-row input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .extra-fuel-row .rm-fuel {
    width: 36px; height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--danger);
    cursor: pointer;
    font-size: 14px;
  }
  .extra-fuel-row .rm-fuel:hover { border-color: var(--danger); background: var(--danger-bg); }

  .check-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px;
  }
  @media (max-width: 380px) {
    .check-grid { grid-template-columns: repeat(2, 1fr); }
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 11px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-2);
    cursor: pointer;
    user-select: none;
  }
  .check-item.on { border-color: var(--success); background: var(--success-bg); }
  .check-item input { width: 17px; height: 17px; accent-color: var(--success); flex-shrink: 0; cursor: pointer; }
  .check-item span { font-size: 13.5px; font-weight: 600; }

  .state-select-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .state-pill {
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .state-pill[data-lvl="ok"].active { background: var(--success-bg); border-color: var(--success); color: var(--success); }
  .state-pill[data-lvl="minor"].active { background: var(--warn-bg); border-color: var(--accent-strong); color: var(--accent-strong); }
  .state-pill[data-lvl="damage"].active { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

  .photo-zone {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    cursor: pointer;
    background: var(--panel-2);
  }
  .photo-zone:hover { border-color: var(--accent); }
  .photo-zone p { margin: 6px 0 0; font-size: 12.5px; color: var(--text-muted); }
  .photo-zone .icon { display: flex; align-items: center; justify-content: center; color: var(--text-muted); }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 8px;
    margin-top: 12px;
  }
  .photo-thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .rm {
    position: absolute; top: 3px; right: 3px;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(20,20,20,.7);
    color: #fff;
    border: none;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .lightbox {
    position: fixed; inset: 0;
    background: rgba(10,10,10,.88);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    padding: 30px;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; }
  .lightbox-close {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.12);
    color: #fff; border: none;
    font-size: 18px; cursor: pointer;
  }

  .save-bar {
    position: sticky; bottom: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    align-items: center;
    gap: 10px;
  }
  .save-bar-actions {
    display: none;
    flex-wrap: wrap;
    gap: 10px;
  }
  .save-bar.revealed .save-bar-actions { display: flex; }
  .save-bar.revealed #saveHint { display: none; }
  @media (max-width: 560px) {
    .save-bar { flex-direction: column; align-items: stretch; }
    .save-bar-actions { flex-direction: column; }
    .save-bar #saveHint { margin-right: 0 !important; text-align: center; }
    .save-bar .btn { width: 100%; text-align: center; padding-top: 11px; padding-bottom: 11px; }
  }

  .toast {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 200;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(10,10,10,.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 150;
    padding: 20px;
  }
  .modal {
    background: var(--panel);
    border-radius: var(--radius);
    max-width: 380px;
    width: 100%;
    padding: 20px;
    border: 1px solid var(--border);
  }
  .modal h3 { margin: 0 0 8px; font-family: var(--mono-tag); font-size: 18px; }
  .modal p { margin: 0 0 16px; color: var(--text-muted); font-size: 13.5px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .settings-modal { max-height: calc(100vh - 40px); overflow-y: auto; }
  .settings-modal .opt { font-weight: normal; color: var(--text-muted); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; padding-top: 4px; }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%; padding: 0; cursor: pointer;
    border: 2px solid var(--panel); box-shadow: 0 0 0 1px var(--border);
    position: relative; overflow: hidden; flex: 0 0 auto;
  }
  .swatch.selected { box-shadow: 0 0 0 2px var(--text); }
  .swatch-custom {
    display: inline-flex; align-items: center; justify-content: center;
    background: conic-gradient(#e53935, #fdd835, #43a047, #1e88e5, #8e24aa, #e53935);
  }
  .swatch-custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">

      base: base,

  var scrollRevealObserver = null;
  function wireScrollReveal(){
    if (scrollRevealObserver){ scrollRevealObserver.disconnect(); scrollRevealObserver = null; }
    var sentinel = document.getElementById('scrollSentinel');
    var saveBar = document.getElementById('saveBar');
    if (!sentinel || !saveBar) return;
    scrollRevealObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting){
          saveBar.classList.add('revealed');
        }
      });
    }, { threshold: 0.01 });
    scrollRevealObserver.observe(sentinel);
  }

  // ---------- photo format safety net for the PDF ----------
  // canvas.toDataURL('image/jpeg', ...) is supposed to always return real JPEG
  // bytes, but some Android WebViews silently return PNG bytes instead while
  // keeping the "image/jpeg" data: URL prefix. Embedding those bytes as if they
  // were JPEG produces a PDF that strict readers (e.g. on a PC) refuse to open,
  // even though lenient ones tolerate the mismatch. We verify the real format
  // via magic bytes and, if it isn't really JPEG, decode it through a canvas and
  // re-embed it as plain RGB pixel data instead (100% format-agnostic).
  function detectRealImageFormat(dataUrl){
    var comma = dataUrl.indexOf(',');
    var b64 = comma !== -1 ? dataUrl.slice(comma + 1) : dataUrl;
    var head = atob(b64.slice(0, 8));
    if (head.charCodeAt(0) === 0xFF && head.charCodeAt(1) === 0xD8) return 'jpeg';
    if (head.charCodeAt(0) === 0x89 && head.charCodeAt(1) === 0x50 && head.charCodeAt(2) === 0x4E && head.charCodeAt(3) === 0x47) return 'png';
    return 'unknown';
  }

  function preparePhotoForPdf(dataUrl){
    return new Promise(function(resolve){
      var realFormat;
      try { realFormat = detectRealImageFormat(dataUrl); } catch(e){ realFormat = 'unknown'; }
      if (realFormat === 'jpeg'){
        resolve(dataUrl);
        return;
      }
      // Not really JPEG: decode via canvas (the browser handles PNG/etc. for us)
      // and re-embed as raw RGB pixels, sidestepping the broken encoder entirely.
      var img = new Image();
      img.onload = function(){
        try {
          var canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          var rgba = imgData.data;
          var rgb = new Uint8Array(canvas.width * canvas.height * 3);
          for (var p = 0, q = 0; p < rgba.length; p += 4, q += 3){
            rgb[q] = rgba[p]; rgb[q + 1] = rgba[p + 1]; rgb[q + 2] = rgba[p + 2];
          }
          if (typeof CompressionStream === 'function'){
            try {
              var cs = new CompressionStream('deflate');
              var writer = cs.writable.getWriter();
              writer.write(rgb);
              writer.close();
              new Response(cs.readable).arrayBuffer().then(function(buf){
                resolve({ rgbFlate: new Uint8Array(buf), width: canvas.width, height: canvas.height });
              }).catch(function(){
                resolve({ rgbRaw: rgb, width: canvas.width, height: canvas.height });
              });
              return;
            } catch(e){ /* fall through to uncompressed */ }
          }
          resolve({ rgbRaw: rgb, width: canvas.width, height: canvas.height });
        } catch(e){
          resolve(null);
        }
      };
      img.onerror = function(){ resolve(null); };
      img.src = dataUrl;
    });
  }

  function buildStyledMissionPDFAsync(m){
    var photos = m.photos || [];
    return Promise.all(photos.map(function(p){ return preparePhotoForPdf(p.dataUrl); }))
      .then(function(prepared){
        return buildStyledMissionPDF(m, prepared);
      });
  }

  // Photos du dégât ajoutées en annexe du PDF de la fiche (une photo par page,
  // en grand). Tout part ainsi dans UNE seule pièce jointe PDF : les photos ne
  // s'affichent plus dans le corps de l'email généré par l'opérateur, et Google
  // Messages accepte une pièce jointe unique avec le destinataire prérempli.
  function getImageSize(dataUrl){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){ resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 }); };
      img.onerror = function(){ resolve(null); };
      img.src = dataUrl;
    });
  }

  function appendPhotoPagesAsync(doc, m){
    var photos = m.photos || [];
    if (!doc || !photos.length) return Promise.resolve(doc);
    return Promise.all(photos.map(function(p){
      return Promise.all([preparePhotoForPdf(p.dataUrl), getImageSize(p.dataUrl)]);
    })).then(function(items){
      var pageW = doc.internal.pageSize.getWidth();
      var pageH = doc.internal.pageSize.getHeight();
      var margin = 12;
      var title = 'Fiche ' + (m.missionNumber ? m.missionNumber + ' - ' : '') + (m.plate || '');
      items.forEach(function(it, idx){
        doc.addPage();
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(11);
        doc.setTextColor(26, 29, 33);
        doc.text('Annexe  —  ' + title + '  —  Photo ' + (idx + 1) + ' / ' + items.length, margin, margin + 4);
        var size = it[1] || { w: 4, h: 3 };
        var boxW = pageW - margin * 2;
        var boxH = pageH - margin * 2 - 10;
        var ratio = Math.min(boxW / size.w, boxH / size.h);
        var w = size.w * ratio, h = size.h * ratio;
        var x = margin + (boxW - w) / 2;
        var y = margin + 10;
        try {
          var imgData = it[0] != null ? it[0] : photos[idx].dataUrl;
          doc.addImage(imgData, 'AUTO', x, y, w, h);
        } catch(e){}
      });
      return doc;
    });
  }

  function buildStyledMissionPDF(m, preparedPhotos){

    doc.setFontSize(15);
    doc.text('Carnet de bord — Fiche mission', margin + 20, 11);

    doc.setFontSize(9);
    doc.text('Gestion de parc — ' + getOrigin(), margin + 20, 17);

    var y = 33;

    // ---- Plate badge + mission number + status ----
    pdfSetDraw(doc, C.text);
    doc.setLineWidth(0.5);
    doc.roundedRect(margin, y, 42, 11, 1, 1);
    pdfSetText(doc, C.text);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);

    var infoX = margin + 48;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9);
    pdfSetText(doc, C.muted);
    if (m.missionNumber){
      doc.text('Mission n° ' + m.missionNumber, infoX, y + 4);

    var done = m.kmEnd !== "" && m.kmEnd !== null && m.kmEnd !== undefined;
    var statusColor = done ? C.success : C.accentStrong;

    pdfSetFill(doc, statusBg);
    doc.roundedRect(infoX, y + 6, 46, 6, 2, 2, 'F');
    pdfSetText(doc, statusColor);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(7.5);
    doc.text(statusLabel, infoX + 23, y + 10, { align: 'center' });

    y += 18;

    // ---- Section helper ----
    var sectionNum = 0;
    function sectionTitle(title){
      sectionNum++;
      y = ensureSpace(y, 14);
      pdfSetFill(doc, C.accent);
      doc.roundedRect(margin, y, 7, 5.5, 1, 1, 'F');
      pdfSetText(doc, C.onAccent);
      doc.setFont('helvetica', 'bold');

    function fieldRow(label, value, colX, colW){

      doc.text(label.toUpperCase(), colX, y);

    // ---- 01 Véhicule & chauffeur ----

    y += 10;
    if (m.kmStart !== "" && m.kmEnd !== "" && !isNaN(m.kmStart) && !isNaN(m.kmEnd)){
      var distance = fmtKmNumber(Number(m.kmEnd) - Number(m.kmStart)) + ' km';
      pdfSetFill(doc, C.panel2);
      doc.roundedRect(margin, y, pageW - margin * 2, 8, 1, 1, 'F');
      pdfSetText(doc, C.muted);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.text('Distance parcourue :', margin + 3, y + 5.3);

      doc.setFont('helvetica', 'bold');

    // ---- 03 Carburant ----

    // ---- 04 Équipement ----

    var eq = m.equipment || {};
    var eqLabels = { fuelCard: 'Carte carburant', telepeage: 'Télépéage', bouclier: 'Bouclier', pareBalle: 'Pare-balle', sac: 'Sac', ceinture: 'Ceinture', entrave: 'Entrave' };
    var eqKeys = Object.keys(eqLabels);
    var eqColW = (pageW - margin * 2 - 12) / 3;
    var eqRowH = 9;
    eqKeys.forEach(function(k, i){
      var col = i % 3;
      var row = Math.floor(i / 3);
      var x = margin + col * (eqColW + 6);
      var yy = y + row * eqRowH;
      var on = !!eq[k];
      pdfSetDraw(doc, on ? C.success : C.border);
      doc.setLineWidth(0.4);
      if (on) pdfSetFill(doc, C.successBg);
      doc.roundedRect(x, yy, eqColW, 7, 1, 1, on ? 'FD' : 'D');
      pdfSetDraw(doc, C.text);
      doc.setLineWidth(0.35);
      doc.rect(x + 2, yy + 2, 3, 3, on ? 'S' : 'S');
      if (on){
        doc.setLineWidth(0.5);
        doc.line(x + 2.3, yy + 3.6, x + 3.2, yy + 4.6);
        doc.line(x + 3.2, yy + 4.6, x + 4.8, yy + 2.3);
      }
      pdfSetText(doc, on ? C.success : C.muted);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(8.5);
      doc.text(eqLabels[k], x + 7, yy + 5);
    });
    y += Math.ceil(eqKeys.length / 3) * eqRowH + 6;

    // ---- 05 État du véhicule ----
    y = ensureSpace(y, 30);
    sectionTitle('État du véhicule');
    var stateLabels = { ok: 'Bon état', minor: 'Usure mineure', damage: 'Dégâts constatés' };
    var stateColorMap = {
      ok: { fg: C.success, bg: C.successBg },
      minor: { fg: C.accentStrong, bg: C.warnBg },
      damage: { fg: C.danger, bg: C.dangerBg }
    };
    var sc = stateColorMap[m.stateLevel] || stateColorMap.ok;
    pdfSetFill(doc, sc.bg);
    var pillLabel = stateLabels[m.stateLevel] || '-';
    var pillW = doc.getTextWidth(pillLabel) + 10;
    doc.roundedRect(margin, y, pillW, 7, 2, 2, 'F');
    pdfSetText(doc, sc.fg);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text(pillLabel, margin + pillW / 2, y + 4.7, { align: 'center' });
    y += 11;
    pdfSetText(doc, C.muted);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.text('REMARQUES', margin, y);
    y += 4.5;
    pdfSetText(doc, C.text);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    var notesLines = doc.splitTextToSize(m.stateNotes || '(aucune remarque)', pageW - margin * 2);
    y = ensureSpace(y, notesLines.length * 5 + 4);
    doc.text(notesLines, margin, y);
    y += notesLines.length * 5 + 8;

    // ---- 06 Photos ----
    if (m.photos && m.photos.length){
      y = ensureSpace(y, 20);
      sectionTitle('Photos des défauts et tickets carburant');
      var thumbW = (pageW - margin * 2 - 2 * 5) / 3;
      var thumbH = thumbW;
      var col2 = 0;
      m.photos.forEach(function(p, idx){
        y = ensureSpace(y, thumbH + 8);
        var x = margin + col2 * (thumbW + 5);
        pdfSetDraw(doc, C.border);
        doc.setLineWidth(0.3);
        doc.roundedRect(x, y, thumbW, thumbH, 1.5, 1.5);
        try {
          var imgData = (preparedPhotos && preparedPhotos[idx] != null) ? preparedPhotos[idx] : p.dataUrl;
          doc.addImage(imgData, 'AUTO', x + 0.8, y + 0.8, thumbW - 1.6, thumbH - 1.6);
        } catch(e){}
        pdfSetText(doc, C.muted);
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(7.5);
        doc.text('Photo ' + (idx + 1), x, y + thumbH + 3.5);
        col2++;
        if (col2 >= 3){ col2 = 0; y += thumbH + 7; }
      });
      if (col2 !== 0) y += thumbH + 7;
    }

    addFooter();
    return doc;
  }

  var downloadsCap = null;

  // ---------- native plugin access (Capacitor Filesystem, SmsComposer) ----------
  // window.Capacitor.Plugins contains working proxies for every natively-registered
  // plugin (Filesystem, Camera, and our own SmsComposer registered in MainActivity).
  function getNativeFilesystem(){
    return (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.Filesystem : null;
  }
  function getNativeSmsComposer(){
    return (window.Capacitor && window.Capacitor.Plugins) ? window.Capacitor.Plugins.SmsComposer : null;
  }
  function isCapacitorNative(){
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && getNativeFilesystem());
  }
  function hasSmsComposer(){
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() && getNativeSmsComposer());
  }
  function blobToBase64(blob){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onloadend = function(){
        var result = reader.result || "";
        var comma = result.indexOf(',');
        resolve(comma !== -1 ? result.slice(comma + 1) : result);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }
  function dataUrlToBase64(dataUrl){
    var comma = dataUrl.indexOf(',');
    return comma !== -1 ? dataUrl.slice(comma + 1) : dataUrl;
  }
  function dataUrlToBlob(dataUrl){
    var comma = dataUrl.indexOf(',');
    var meta = comma !== -1 ? dataUrl.slice(0, comma) : '';
    var mimeMatch = meta.match(/:(.*?);/);
    var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    var binary = atob(dataUrlToBase64(dataUrl));
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new Blob([bytes], { type: mime });
  }

  // Saves the PDF and all mission photos into fiche_vehicule/<AAAA-MM-JJ>/ on the
  // device's Documents storage, using Capacitor's native Filesystem plugin.
  // Only works once @capacitor/filesystem is added to the native project.
  function saveMissionFilesNative(m, pdfBlob, pdfFilename){
    var Filesystem = getNativeFilesystem();
    var folder = 'fiche_vehicule/' + todayISODate();
    var baseName = pdfFilename.replace(/\.pdf$/i, '');

    return blobToBase64(pdfBlob).then(function(pdfBase64){
      return Filesystem.writeFile({
        path: folder + '/' + pdfFilename,
        data: pdfBase64,
        directory: 'DOCUMENTS',
        recursive: true
      });
    }).then(function(){
      var photos = m.photos || [];
      var chain = Promise.resolve();
      photos.forEach(function(p, idx){
        chain = chain.then(function(){
          return Filesystem.writeFile({
            path: folder + '/' + baseName + '_photo_' + (idx + 1) + '.jpg',
            data: dataUrlToBase64(p.dataUrl),
            directory: 'DOCUMENTS',
            recursive: true
          });
        });
      });
      return chain;
    }).then(function(){
      return folder;
    });
  }

  function exportMissionPdf(m){
    persistForm(m);
    showToast('Génération du PDF…');

    buildStyledMissionPDFAsync(m).then(function(doc){
    var rawName = m.missionNumber ? m.missionNumber : (m.plate || 'sans_numero');
    var filename = rawName.replace(/[\\/:*?"<>|]+/g, '-') + '.pdf';
    var blob = doc.output('blob');

    if (isCapacitorNative()){
      saveMissionFilesNative(m, blob, filename)
        .then(function(folder){
          var count = 1 + (m.photos ? m.photos.length : 0);
          showToast(count + ' fichier(s) enregistré(s) dans Documents/' + folder);
        })
        .catch(function(err){
          console.error('Native save failed', err);
          showToast("Échec de l'enregistrement natif, tentative via le partage…");
          fallbackShareOrDownload();
        });
      return;
    }

    fallbackShareOrDownload();

    function fallbackShareOrDownload(){

      function viaBlobAnchor(){
        try {
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
          showToast('PDF téléchargé.');
        } catch(e){
          showToast("Impossible d'enregistrer le PDF sur cet appareil.");
        }
      }

      function viaDownloadsCapOrAnchor(){
        if (downloadsCap){
          downloadsCap.save({ filename: filename, data: blob })
            .then(function(){ showToast('PDF téléchargé.'); })
            .catch(function(err){
              if (err && err.code === 'declined'){ showToast('Téléchargement annulé.'); }
              else { viaBlobAnchor(); }
            });
        } else {
          viaBlobAnchor();
        }
      }

      // Prefer native share first: it carries the correct PDF file type through
      // the OS share sheet, unlike a blob: download which some WebViews save
      // with the wrong extension (e.g. .bin) because they can't read the blob's type.
      try {
        var pdfFile = new File([blob], filename, { type: 'application/pdf' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [pdfFile] })){
          navigator.share({ files: [pdfFile] })
            .then(function(){ showToast('Choisissez où enregistrer le PDF.'); })
            .catch(function(err){
              if (err && err.name === 'AbortError') return;
              viaDownloadsCapOrAnchor();
            });
          return;
        }
      } catch(e){ /* fall through */ }

      viaDownloadsCapOrAnchor();
    }
    });
  }

  function buildMessageBodyText(m){
    var eq = m.equipment || {};
    var eqLabels = { fuelCard: 'Carte carburant', telepeage: 'Télépéage', bouclier: 'Bouclier', pareBalle: 'Pare-balle', sac: 'Sac', ceinture: 'Ceinture', entrave: 'Entrave' };
    var stateLabels = { ok: 'Bon état', minor: 'Usure mineure', damage: 'Dégâts constatés' };
    var distance = "";
    if (m.kmStart !== "" && m.kmEnd !== "" && !isNaN(m.kmStart) && !isNaN(m.kmEnd)){
      distance = fmtKmNumber(Number(m.kmEnd) - Number(m.kmStart)) + ' km';
    }
    var lines = [];
    lines.push('Fiche mission — ' + (m.plate || 'Sans plaque'));
    lines.push('Origine : ' + getOrigin());
    lines.push('');
    if (m.missionNumber) lines.push('Numéro de mission : ' + m.missionNumber);
    lines.push('Date : ' + isoToFrDate(m.missionDate));
    if (m.destination) lines.push('Destination : ' + m.destination);
    lines.push('Chauffeur : ' + (m.driver || '-'));
    lines.push('Kilométrage départ : ' + fmtKm(m.kmStart));
    lines.push('Kilométrage fin : ' + fmtKm(m.kmEnd));
    if (distance) lines.push('Distance parcourue : ' + distance);
    lines.push('Plein effectué : ' + fuelSummary(m));
    lines.push('');
    lines.push('Équipement présent :');
    Object.keys(eqLabels).forEach(function(k){
      lines.push('- ' + eqLabels[k] + ' : ' + (eq[k] ? 'Oui' : 'Non'));
    });
    lines.push('');
    lines.push('État du véhicule : ' + (stateLabels[m.stateLevel] || '-'));
    lines.push('Remarques : ' + (m.stateNotes || '(aucune)'));
    if (m.photos && m.photos.length){
      lines.push('');
      lines.push('(Fiche PDF en pièce jointe, avec ' + m.photos.length + ' photo(s) du dégât en annexe)');
    } else {
      lines.push('');
      lines.push('(Fiche PDF en pièce jointe)');
    }
    return lines.join('\n');
  }

  function sniffImageExt(dataUrl){
    try {
      var comma = dataUrl.indexOf(',');
      var b64 = comma !== -1 ? dataUrl.slice(comma + 1) : dataUrl;
      var head = atob(b64.slice(0, 8));
      if (head.charCodeAt(0) === 0xFF && head.charCodeAt(1) === 0xD8) return 'jpg';
      if (head.charCodeAt(0) === 0x89 && head.charCodeAt(1) === 0x50) return 'png';
    } catch(e){}
    return 'jpg';
  }

  function sendMissionBySms(m){
    var emails = getDestEmails();
    if (!emails.length){
      showToast("Définissez d'abord l'adresse email de destination.");
      openSettingsModal(function(){ sendMissionBySms(m); });
      return;
    }
    var email = emails.join(',');

    showToast('Préparation du PDF…');
    buildStyledMissionPDFAsync(m).then(function(doc){
      return appendPhotoPagesAsync(doc, m);
    }).then(function(doc){
    var rawName = m.missionNumber ? m.missionNumber : (m.plate || 'sans_numero');
    var baseName = rawName.replace(/[\\/:*?"<>|]+/g, '-');
    var pdfFilename = baseName + '.pdf';
    var text = buildMessageBodyText(m);

    // Application SMS native du téléphone, uniquement (pas de menu de partage)
    if (hasSmsComposer()){
      var SmsComposer = getNativeSmsComposer();
      var attachments = [];
      var prep = Promise.resolve();
      if (doc){
        prep = prep.then(function(){ return blobToBase64(doc.output('blob')); })
          .then(function(b64){ attachments.push({ data: b64, name: pdfFilename }); });
      }
      prep.then(function(){
        return SmsComposer.composeSms({ to: email, body: text, attachments: attachments });
      }).then(function(){
        showToast(emails.length > 1
          ? 'Message prêt pour les 2 adresses. Si elles n\'apparaissent pas, elles sont copiées : collez-les.'
          : 'Message prêt. Si l\'adresse n\'apparaît pas, elle est copiée : collez-la dans le destinataire.', 7000);
      }).catch(function(err){
        console.error('SmsComposer failed', err);
        var detail = "";
        try { detail = (err && (err.message || err.errorMessage)) ? (err.message || err.errorMessage) : JSON.stringify(err); }
        catch(e2){ detail = String(err); }
        window.alert("L'ouverture de l'application SMS a échoué.\n\nDétail exact (à me communiquer) :\n" + detail);
      });
      return;
    }

    // Hors application Android (navigateur) : seul le texte peut être prérempli
    window.location.href = 'sms:' + encodeURIComponent(email).replace(/%40/g, '@') + '?body=' + encodeURIComponent(text);
    showToast("Pièces jointes indisponibles hors de l'application Android.");
    });
  }

  // ---------- wiring: global ----------
  document.getElementById('btnSettings').addEventListener('click', function(){ openSettingsModal(); });
  document.getElementById('btnNewTop').addEventListener('click', createMission);

  // Autosave lightly on blur of key fields to reduce data loss risk
  document.addEventListener('blur', function(e){
    var t = e.target;
    if (!t) return;
    var isExtraFuel = t.classList && t.classList.contains('extra-fuel-input');
    if (isExtraFuel || (t.id && ['f-missionnum','f-missiondate','f-destination','f-plate','f-driver','f-kmstart','f-kmend','f-fuelkm','f-notes'].indexOf(t.id) !== -1)){
      var m = missions.find(function(x){ return x.id === activeId; });
      if (m) persistForm(m);
    }
  }, true);

  // ---------- init ----------
  loadMissions();
  renderAll();

  if (window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(function(cap){ downloadsCap = cap; }).catch(function(){});
  }

  // Enables offline use once hosted (e.g. on Netlify) and wrapped as an app
  // (e.g. via Median.co): the app needs to be opened once with a connection
  // so the service worker can cache it, then it keeps working offline.
  // Silently does nothing where unsupported or not served over http(s)
  // (such as this Claude preview).
  if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
