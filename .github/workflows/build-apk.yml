name: Build Android APK

# Se declenche automatiquement a chaque envoi sur la branche "main",
# et peut aussi etre lance manuellement depuis l'onglet Actions de GitHub.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer le JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Le SDK Android est deja preinstalle sur les machines GitHub (ubuntu-latest),
      # avec les licences deja acceptees : pas besoin d'etape supplementaire ici.
      # (une etape "setup-android" supplementaire a deja cause un echec par le passe
      #  car elle tentait de telecharger un composant "tools" obsolete)

      - name: Installer les dependances npm
        run: npm install

      - name: Ajouter la plateforme Android
        run: npx cap add android

      - name: Installer le plugin SMS natif (maison)
        run: |
          PKG_DIR=android/app/src/main/java/com/prejmarseille/carnetdebord
          mkdir -p "$PKG_DIR"
          # remplace la MainActivity generee par celle qui enregistre le plugin SMS
          find android/app/src/main -name 'MainActivity.*' -delete
          cp native-android/*.java "$PKG_DIR"/
          # chemins du FileProvider (inclut le cache, ou sont ecrites les pieces jointes)
          mkdir -p android/app/src/main/res/xml
          cp native-android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          grep -q "fileprovider" android/app/src/main/AndroidManifest.xml || { echo "FileProvider absent du manifeste"; exit 1; }
          # autorisation d'envoi automatique des MMS
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.SEND_SMS" "$MANIFEST" || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SEND_SMS" />\n</manifest>#' "$MANIFEST"
          grep -q "android.permission.SEND_SMS" "$MANIFEST" || { echo "Permission SEND_SMS non ajoutee"; exit 1; }
          cat "$MANIFEST"

      - name: Generer l'icone de l'app
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Synchroniser le code web et les plugins natifs
        run: npx cap sync android

      - name: Autoriser l'execution de gradlew
        run: chmod +x android/gradlew

      - name: Compiler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Mettre l'APK a disposition en telechargement
        uses: actions/upload-artifact@v4
        with:
          name: carnet-de-bord-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
